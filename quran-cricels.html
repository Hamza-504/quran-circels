<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة حلقات القرآن</title>
  <!-- Tailwind CSS للتصميم -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel لقراءة كود React -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. ضع إعدادات Firebase الخاصة بك هنا
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const JUZ_AMMA = [
      'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين',
      'الانشقاق', 'البروج', 'الطارق', 'الأعلى', 'الغاشية', 'الفجر',
      'البلد', 'الشمس', 'الليل', 'الضحى', 'الشرح', 'التين',
      'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة',
      'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون',
      'الكوثر', 'الكافرون', 'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'
    ];

    function App() {
      const [user, setUser] = React.useState(null);
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [isRegistering, setIsRegistering] = React.useState(false);

      React.useEffect(() => {
        return auth.onAuthStateChanged((u) => setUser(u));
      }, []);

      const handleAuth = async (e) => {
        e.preventDefault();
        try {
          if (isRegistering) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          alert("خطأ: " + err.message);
        }
      };

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
              <h2 className="text-2xl font-bold text-center text-emerald-800 mb-6">🕌 نظام إدارة حلقات القرآن</h2>
              <form onSubmit={handleAuth} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700">البريد الإلكتروني</label>
                  <input type="email" required className="w-full mt-1 p-2 border rounded-md" value={email} onChange={e => setEmail(e.target.value)} />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700">كلمة المرور</label>
                  <input type="password" required className="w-full mt-1 p-2 border rounded-md" value={password} onChange={e => setPassword(e.target.value)} />
                </div>
                <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-md font-bold hover:bg-emerald-700">
                  {isRegistering ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
                </button>
              </form>
              <button onClick={() => setIsRegistering(!isRegistering)} className="w-full text-center text-sm text-emerald-600 mt-4 underline">
                {isRegistering ? 'لديك حساب؟ سجل دخولك' : 'حساب جديد؟ اضغط هنا'}
              </button>
            </div>
          </div>
        );
      }

      return <Dashboard user={user} />;
    }

    function Dashboard({ user }) {
      const [circles, setCircles] = React.useState([]);
      const [selectedCircleId, setSelectedCircleId] = React.useState('');
      const [students, setStudents] = React.useState([]);
      const [newCircleName, setNewCircleName] = React.useState('');
      const [newStudentName, setNewStudentName] = React.useState('');
      const [curriculum, setCurriculum] = React.useState('');
      const [selectedStudent, setSelectedStudent] = React.useState(null);
      const [reportText, setReportText] = React.useState('');
      const [showReport, setShowReport] = React.useState(false);

      const todayDate = new Date().toISOString().split('T')[0];

      React.useEffect(() => {
        return db.collection('circles').where('supervisorId', '==', user.uid).onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCircles(list);
          if (list.length > 0 && !selectedCircleId) setSelectedCircleId(list[0].id);
        });
      }, [user.uid]);

      React.useEffect(() => {
        if (!selectedCircleId) return;
        const unsub1 = db.collection('students').where('circleId', '==', selectedCircleId).onSnapshot(snap => {
          setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsub2 = db.collection('curriculums').where('circleId', '==', selectedCircleId).where('date', '==', todayDate).onSnapshot(snap => {
          setCurriculum(snap.empty ? '' : snap.docs[0].data().content);
        });
        return () => { unsub1(); unsub2(); };
      }, [selectedCircleId, todayDate]);

      const addCircle = async () => {
        if (!newCircleName.trim()) return;
        await db.collection('circles').add({ name: newCircleName.trim(), supervisorId: user.uid });
        setNewCircleName('');
      };

      const addStudent = async () => {
        if (!newStudentName.trim() || !selectedCircleId) return;
        await db.collection('students').add({ name: newStudentName.trim(), circleId: selectedCircleId, supervisorId: user.uid });
        setNewStudentName('');
      };

      const deleteStudent = async (id) => {
        if (confirm('حذف هذا الطالب؟')) await db.collection('students').doc(id).delete();
      };

      const saveCurriculum = async () => {
        await db.collection('curriculums').doc(`${selectedCircleId}_${todayDate}`).set({ circleId: selectedCircleId, date: todayDate, content: curriculum });
        alert('تم حفظ المقرر');
      };

      const generateReport = async () => {
        const circle = circles.find(c => c.id === selectedCircleId);
        let text = `🕌 *تقرير حلقة: ${circle ? circle.name : ''}*\n📅 *التاريخ:* ${todayDate}\n\n`;
        if (curriculum.trim()) text += `📚 *المقرر النظرية اليومي:*\n${curriculum}\n-----------------------------------\n`;
        text += `👥 *تقييم الطلاب اليومي:*\n\n`;

        for (let i = 0; i < students.length; i++) {
          const s = students[i];
          text += `${i + 1}️⃣ *الطالب:* ${s.name}\n`;
          const snap = await db.collection('evaluations').where('studentId', '==', s.id).where('date', '==', todayDate).get();
          if (snap.empty) {
            text += `   • لم يتم التسميع اليوم.\n`;
          } else {
            snap.forEach(doc => {
              const d = doc.data();
              text += `   • *الحفظ:* سورة ${d.surah} (${d.rating})\n   • *السلوك:* ${d.behavior}\n`;
            });
          }
          text += `\n`;
        }
        text += `-----------------------------------\nجزاكم الله خيراً وبارك في أبنائكم 🌹`;
        setReportText(text);
        setShowReport(true);
      };

      return (
        <div className="p-4 max-w-3xl mx-auto space-y-4">
          <header className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <h1 className="font-bold text-lg text-emerald-800">نظام إدارة الحلقات</h1>
            <button onClick={() => auth.signOut()} className="text-red-600 text-sm border p-1 rounded">خروج</button>
          </header>

          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <label className="block font-bold text-sm">اختر الحلقة:</label>
            <div className="flex gap-2">
              <select value={selectedCircleId} onChange={e => setSelectedCircleId(e.target.value)} className="flex-1 p-2 border rounded-lg">
                {circles.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <input type="text" placeholder="حلقة جديدة" value={newCircleName} onChange={e => setNewCircleName(e.target.value)} className="p-2 border rounded-lg text-sm" />
              <button onClick={addCircle} className="bg-emerald-600 text-white px-3 rounded-lg text-sm font-bold">+ إضافة</button>
            </div>
          </div>

          {selectedCircleId && (
            <>
              <div className="bg-white p-4 rounded-xl shadow-sm space-y-2">
                <div className="flex justify-between"><span className="font-bold text-sm">📘 المقرر النظرية اليومي:</span><button onClick={saveCurriculum} className="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-bold">حفظ</button></div>
                <textarea rows="2" value={curriculum} onChange={e => setCurriculum(e.target.value)} className="w-full p-2 border rounded-lg text-sm" placeholder="درس التجويد أو المواد النظرية..." />
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <div className="flex justify-between items-center">
                  <span className="font-bold">قائمة الطلاب ({students.length})</span>
                  <div className="flex gap-2">
                    <input type="text" placeholder="اسم الطالب" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="p-1 border rounded text-sm" />
                    <button onClick={addStudent} className="bg-teal-600 text-white px-2 py-1 rounded text-sm font-bold">+ إضافة</button>
                  </div>
                </div>
                <div className="divide-y">
                  {students.map((s, idx) => (
                    <div key={s.id} className="py-2 flex justify-between items-center">
                      <span className="cursor-pointer font-bold hover:text-emerald-600" onClick={() => setSelectedStudent(s)}>{idx + 1}. {s.name} <span className="text-xs text-gray-400">(اضغط للتقييم)</span></span>
                      <button onClick={() => deleteStudent(s.id)} className="text-red-500 text-xs">حذف</button>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={generateReport} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow hover:bg-green-700">📱 توليد تقرير الواتساب</button>
            </>
          )}

          {selectedStudent && <EvalModal student={selectedStudent} date={todayDate} onClose={() => setSelectedStudent(null)} />}
          {showReport && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-xl max-w-lg w-full space-y-3">
                <h3 className="font-bold">تقرير الواتساب الجاهز</h3>
                <textarea readOnly rows="10" value={reportText} className="w-full p-2 border rounded bg-slate-50 text-sm font-mono" />
                <div className="flex gap-2">
                  <button onClick={() => { navigator.clipboard.writeText(reportText); alert('تم النسخ!'); }} className="flex-1 bg-green-600 text-white py-2 rounded font-bold">نسخ النص</button>
                  <button onClick={() => setShowReport(false)} className="bg-gray-200 px-4 rounded font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function EvalModal({ student, date, onClose }) {
      const [surah, setSurah] = React.useState(JUZ_AMMA[0]);
      const [rating, setRating] = React.useState('ممتاز');
      const [behavior, setBehavior] = React.useState('جيد');

      const save = async () => {
        await db.collection('evaluations').doc(`${student.id}_${date}_${surah}`).set({ studentId: student.id, date, surah, rating, behavior });
        alert(`تم حفظ سورة ${surah}`);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
          <div className="bg-white p-6 rounded-xl max-w-md w-full space-y-4">
            <h3 className="font-bold text-emerald-800">تقييم: {student.name}</h3>
            <select value={surah} onChange={e => setSurah(e.target.value)} className="w-full p-2 border rounded">
              {JUZ_AMMA.map(s => <option key={s} value={s}>سورة {s}</option>)}
            </select>
            <div className="flex gap-1">
              {['إعادة', 'جيد', 'جيد جداً', 'ممتاز'].map(r => (
                <button key={r} onClick={() => setRating(r)} className={`flex-1 p-1 text-xs border rounded ${rating === r ? 'bg-emerald-600 text-white' : ''}`}>{r}</button>
              ))}
            </div>
            <div className="flex gap-1">
              {['جيد', 'بحاجة تحسين'].map(b => (
                <button key={b} onClick={() => setBehavior(b)} className={`flex-1 p-1 text-xs border rounded ${behavior === b ? 'bg-emerald-600 text-white' : ''}`}>{b}</button>
              ))}
            </div>
            <button onClick={save} className="w-full bg-emerald-600 text-white py-2 rounded font-bold">حفظ التقييم</button>
            <button onClick={onClose} className="w-full bg-gray-200 py-1 rounded text-sm">إغلاق</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
