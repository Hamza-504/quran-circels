<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة حلقات القرآن الكريم - المساجد</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. إعدادات Firebase
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBCzlYbSq6ocwpDzhEeEZr0eDrg6cM3ecc",
      authDomain: "hamod-naser.firebaseapp.com",
      projectId: "hamod-naser",
      storageBucket: "hamod-naser.firebasestorage.app",
      messagingSenderId: "337847802811",
      appId: "1:337847802811:web:7e6c5989a4137310bc029e",
      measurementId: "G-YTXZNQ59QR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const formatDateToArabic = (dateString) => {
      if (!dateString) return '';
      const [year, month, day] = dateString.split('-');
      return `${day}/${month}/${year}`;
    };

    const JUZ_AMMA = [
      'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين', 'الانشقاق', 'البروج', 
      'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'الليل', 'الضحى', 
      'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 
      'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 
      'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'
    ];

    // ==========================================
    // التطبيق الرئيسي مع جلب ملف المستخدم الأدوار
    // ==========================================
    function App() {
      const [user, setUser] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async (u) => {
          setUser(u);
          if (u) {
            // جلب ملف المستخدم وصلاحياته
            const docRef = db.collection('users').doc(u.uid);
            const docSnap = await docRef.get();
            if (docSnap.exists) {
              setUserProfile(docSnap.data());
            } else {
              setUserProfile(null); // ينقله لإكمال المعرف الخاص
            }
          } else {
            setUserProfile(null);
          }
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) return <div className="flex justify-center items-center h-screen text-emerald-800 font-bold">جاري التحميل...</div>;

      if (!user) return <AuthScreen />;
      if (user && !userProfile) return <OnboardingScreen user={user} onComplete={setUserProfile} />;

      return <MainLayout user={user} userProfile={userProfile} />;
    }

    // ==========================================
    // 2. شاشة إكمال البيانات (إدخال المعرف الخاص أول مرة)
    // ==========================================
    function OnboardingScreen({ user, onComplete }) {
      const [username, setUsername] = React.useState('');
      const [error, setError] = React.useState('');
      const [submitting, setSubmitting] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        const cleanUsername = username.trim().toLowerCase().replace(/\s+/g, '_');
        if (!cleanUsername) return setError("يرجى أدخال المعرّف الخاص");

        setSubmitting(true);
        setError('');

        try {
          // التحقق من عدم تكرار اسم المستخدم
          const checkSnap = await db.collection('users').where('username', '==', cleanUsername).get();
          if (!checkSnap.empty) {
            setSubmitting(false);
            return setError("هذا المعرّف مستخدم بالفعل! اختر معرفاً آخر.");
          }

          const profileData = {
            uid: user.uid,
            email: user.email,
            username: cleanUsername,
            role: 'viewer', // متصفح افتراضياً
            masjidId: null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          await db.collection('users').doc(user.uid).set(profileData);
          onComplete(profileData);
        } catch (err) {
          setError("حدث خطأ: " + err.message);
          setSubmitting(false);
        }
      };

      return (
        <div className="flex items-center justify-center min-h-screen p-4">
          <div className="bg-white p-8 rounded-2xl shadow-md max-w-sm w-full space-y-4">
            <h2 className="text-xl font-bold text-center text-emerald-800">مرحباً بك! 👋</h2>
            <p className="text-xs text-center text-gray-500">اختر معرفاً خاصاً بكتُميّز به في النظام (مثال: ahmed_homs)</p>
            
            {error && <div className="bg-red-50 text-red-600 text-xs p-2 rounded border border-red-200">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">المعرّف الخاص (Username)</label>
                <div className="flex items-center border rounded-lg overflow-hidden bg-gray-50 px-2">
                  <span className="text-gray-400 font-bold text-sm">@</span>
                  <input 
                    type="text" 
                    required 
                    placeholder="username"
                    value={username} 
                    onChange={e => setUsername(e.target.value)} 
                    className="w-full p-2 bg-transparent text-sm focus:outline-none" 
                  />
                </div>
              </div>
              <button disabled={submitting} type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700 disabled:opacity-50">
                {submitting ? 'جاري الحفظ...' : 'حفظ واستكمال'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. شاشة تسجيل الدخول
    // ==========================================
    function AuthScreen() {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [isSignUp, setIsSignUp] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          alert("خطأ: " + err.message);
        }
      };

      const handleGoogleSignIn = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
        } catch (err) {
          alert("خطأ أثناء تسجيل الدخول بـ Google: " + err.message);
        }
      };

      return (
        <div className="flex items-center justify-center min-h-screen p-4">
          <div className="bg-white p-8 rounded-2xl shadow-md max-w-sm w-full space-y-4">
            <h2 className="text-xl font-bold text-center text-emerald-800">🕌 نظام إدارة حلقات القرآن</h2>
            <p className="text-xs text-center text-gray-500 font-bold">تسجيل الدخول للنظام العام</p>
            
            <button 
              onClick={handleGoogleSignIn}
              type="button"
              className="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 py-2 rounded-lg font-bold shadow-sm hover:bg-gray-50 transition text-sm"
            >
              <svg className="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>الدخول باستخدام Google</span>
            </button>

            <div className="flex items-center my-2">
              <div className="flex-1 border-t border-gray-200"></div>
              <span className="px-3 text-xs text-gray-400 font-bold">أو</span>
              <div className="flex-1 border-t border-gray-200"></div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">كلمة المرور</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
              </div>
              <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700">
                {isSignUp ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
              </button>
            </form>
            <button onClick={() => setIsSignUp(!isSignUp)} className="w-full text-xs text-emerald-700 underline text-center block">
              {isSignUp ? 'لديك حساب؟ سجل دخولك' : 'حساب جديد؟ اضغط هنا'}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. الهيكل الرئيسي مع الشريط العلوي
    // ==========================================
    function MainLayout({ user, userProfile }) {
      const [currentView, setCurrentView] = React.useState('dashboard');

      const roleBadgeColor = {
        admin: 'bg-red-500 text-white',
        supervisor: 'bg-emerald-600 text-white',
        viewer: 'bg-gray-500 text-white'
      }[userProfile.role] || 'bg-gray-400 text-white';

      const roleBadgeText = {
        admin: 'مطور (Admin)',
        supervisor: `مشرف (${userProfile.masjidId || 'غير محدد'})`,
        viewer: 'متصفح'
      }[userProfile.role];

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-emerald-800 text-white px-4 md:px-6 py-3 shadow-md flex justify-between items-center sticky top-0 z-40">
            <div className="font-bold text-xs md:text-sm flex items-center gap-2">
              <span>🕌</span>
              <span>تطبيق الحلقات</span>
              <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${roleBadgeColor}`}>
                @{userProfile.username} ({roleBadgeText})
              </span>
            </div>

            <div className="flex items-center gap-2">
              {userProfile.role === 'admin' && (
                <button 
                  onClick={() => setCurrentView('users_admin')} 
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-bold shadow transition border ${currentView === 'users_admin' ? 'bg-amber-500 text-white border-amber-400' : 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-500'}`}
                >
                  ⚙️ إدارة الصلاحيات
                </button>
              )}

              {currentView === 'dashboard' ? (
                <button 
                  onClick={() => setCurrentView('global_db')} 
                  className="bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold shadow transition border border-emerald-500"
                >
                  📊 البيانات التراكمية
                </button>
              ) : (
                <button 
                  onClick={() => setCurrentView('dashboard')} 
                  className="bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold shadow transition border border-emerald-500"
                >
                  🏠 إدارة الحلقات
                </button>
              )}
              
              <button 
                onClick={() => auth.signOut()} 
                className="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold shadow"
              >
                خروج
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4">
            {currentView === 'dashboard' && <Dashboard userProfile={userProfile} />}
            {currentView === 'global_db' && <GlobalDatabaseView />}
            {currentView === 'users_admin' && userProfile.role === 'admin' && <AdminUsersPanel />}
          </main>
        </div>
      );
    }

    // ==========================================
    // 5. لوحة المطور (إدارة المستخدمين والأدوار)
    // ==========================================
    function AdminUsersPanel() {
      const [usersList, setUsersList] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const unsub = db.collection('users').onSnapshot(snap => {
          setUsersList(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        });
        return () => unsub();
      }, []);

      const updateUserRole = async (targetUid, newRole) => {
        let masjidId = null;
        if (newRole === 'supervisor') {
          masjidId = prompt("أدخل اسم/معرف المسجد للمشرف (مثال: جامع حمود الناصر):", "جامع حمود الناصر");
          if (!masjidId) return;
        }

        try {
          await db.collection('users').doc(targetUid).update({
            role: newRole,
            masjidId: masjidId
          });
          alert("تم تحديث صلاحية المستخدم بنجاح!");
        } catch (e) {
          alert("خطأ أثناء التحديث: " + e.message);
        }
      };

      if (loading) return <div className="text-center py-8 font-bold text-emerald-800">جاري تحميل قائمة المستخدمين...</div>;

      return (
        <div className="bg-white p-6 rounded-xl shadow-sm border space-y-4">
          <div className="border-b pb-3">
            <h2 className="text-lg font-bold text-red-700 flex items-center gap-2">
              ⚙️ لوحة المطور - توزيع الأدوار والصلاحيات
            </h2>
            <p className="text-xs text-gray-500">يمكنك ترقية المتصفحين إلى مشرفين وتحديد المسجد المخصص لهم</p>
          </div>

          <div className="divide-y">
            {usersList.map(u => (
              <div key={u.id} className="py-3 flex flex-wrap justify-between items-center gap-2">
                <div>
                  <div className="font-bold text-sm text-gray-800">@{u.username || 'بدون_معرف'}</div>
                  <div className="text-xs text-gray-400">{u.email}</div>
                  {u.masjidId && <div className="text-[11px] text-emerald-600 font-bold">المسجد: {u.masjidId}</div>}
                </div>

                <div className="flex items-center gap-2">
                  <select 
                    value={u.role || 'viewer'} 
                    onChange={e => updateUserRole(u.id, e.target.value)}
                    className="p-1.5 border rounded-lg text-xs font-bold bg-gray-50"
                  >
                    <option value="viewer">متصفح (Viewer)</option>
                    <option value="supervisor">مشرف (Supervisor)</option>
                    <option value="admin">مطور (Admin)</option>
                  </select>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. لوحة التحكم الرئيسية (مع القيود حسب الصلاحية)
    // ==========================================
    function Dashboard({ userProfile }) {
      const [circles, setCircles] = React.useState([]);
      const [selectedCircleId, setSelectedCircleId] = React.useState('');
      const [newCircleName, setNewCircleName] = React.useState('');
      const [students, setStudents] = React.useState([]);
      const [newStudentName, setNewStudentName] = React.useState('');
      const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
      
      const [lessonTopic, setLessonTopic] = React.useState('');
      const [todayEvaluations, setTodayEvaluations] = React.useState([]);
      const [absentStudents, setAbsentStudents] = React.useState({});
      const [activeModalStudent, setActiveModalStudent] = React.useState(null);

      const canEdit = userProfile.role === 'admin' || userProfile.role === 'supervisor';

      React.useEffect(() => {
        const unsub = db.collection('circles')
          .onSnapshot(snap => {
            let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            // إذا كان مشرفاً، يرى حلقات مسجده فقط (أو الكل إذا كان مطوراً أو متصفحاً)
            if (userProfile.role === 'supervisor' && userProfile.masjidId) {
              list = list.filter(c => !c.masjidId || c.masjidId === userProfile.masjidId);
            }
            setCircles(list);
            if (list.length > 0 && !selectedCircleId) {
              setSelectedCircleId(list[0].id);
            }
          });
        return () => unsub();
      }, [userProfile]);

      React.useEffect(() => {
        if (!selectedCircleId) { 
          setStudents([]); 
          setTodayEvaluations([]); 
          setLessonTopic('');
          setAbsentStudents({});
          return; 
        }

        const unsubStudents = db.collection('students')
          .where('circleId', '==', selectedCircleId)
          .onSnapshot(snap => {
            setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

        const unsubEvals = db.collection('evaluations')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .onSnapshot(snap => {
            const evals = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setTodayEvaluations(evals);
            
            const absentMap = {};
            evals.forEach(e => {
              if (e.isAbsent) absentMap[e.studentId] = true;
            });
            setAbsentStudents(absentMap);
          });

        const unsubLesson = db.collection('lessons')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .onSnapshot(snap => {
            if (!snap.empty) {
              setLessonTopic(snap.docs[0].data().topic || '');
            } else {
              setLessonTopic('');
            }
          });

        return () => {
          unsubStudents();
          unsubEvals();
          unsubLesson();
        };
      }, [selectedCircleId, date]);

      const addCircle = async () => {
        if (!canEdit || !newCircleName.trim()) return;
        await db.collection('circles').add({ 
          name: newCircleName.trim(), 
          masjidId: userProfile.masjidId || 'عام',
          createdBy: userProfile.username 
        });
        setNewCircleName('');
      };

      const editCircleName = async (circle) => {
        if (!canEdit) return;
        const updated = prompt("أدخل الاسم الجديد للحلقة:", circle.name);
        if (updated && updated.trim()) {
          await db.collection('circles').doc(circle.id).update({ name: updated.trim() });
        }
      };

      const deleteCircle = async (circle) => {
        if (!canEdit) return;
        if (!confirm(`هل أنت تأكد من حذف حلقة (${circle.name})؟`)) return;
        await db.collection('circles').doc(circle.id).delete();
        setSelectedCircleId('');
      };

      const addStudent = async () => {
        if (!canEdit || !newStudentName.trim() || !selectedCircleId) return;
        await db.collection('students').add({ name: newStudentName.trim(), circleId: selectedCircleId });
        setNewStudentName('');
      };

      const deleteStudent = async (id) => {
        if (!canEdit) return;
        if (confirm("هل أنت تأكد من حذف هذا الطالب؟")) {
          await db.collection('students').doc(id).delete();
        }
      };

      const toggleAttendance = async (student) => {
        if (!canEdit) return;
        const isCurrentlyAbsent = !!absentStudents[student.id];
        const newAbsentState = !isCurrentlyAbsent;

        setAbsentStudents(prev => ({ ...prev, [student.id]: newAbsentState }));

        const existingEval = todayEvaluations.find(e => e.studentId === student.id);
        if (existingEval) {
          await db.collection('evaluations').doc(existingEval.id).update({
            isAbsent: newAbsentState
          });
        } else {
          await db.collection('evaluations').add({
            studentId: student.id,
            studentName: student.name,
            circleId: selectedCircleId,
            circleName: selectedCircleObj ? selectedCircleObj.name : '',
            date,
            isAbsent: newAbsentState,
            recitations: [],
            behavior: 'جيد',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      };

      const saveLessonTopic = async (topicValue) => {
        setLessonTopic(topicValue);
        if (!canEdit || !selectedCircleId) return;
        
        const snap = await db.collection('lessons')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .get();

        if (snap.empty) {
          await db.collection('lessons').add({
            circleId: selectedCircleId,
            date: date,
            topic: topicValue
          });
        } else {
          await db.collection('lessons').doc(snap.docs[0].id).update({ topic: topicValue });
        }
      };

      const selectedCircleObj = circles.find(c => c.id === selectedCircleId);

      const generateWhatsappText = () => {
        if (!selectedCircleObj) return '';

        let text = `السلام عليكم ورحمة الله وبركاته\n*تقرير حلقة: ${selectedCircleObj.name}*\n`;
        text += `*التاريخ:* ${formatDateToArabic(date)}\n`;
        if (lessonTopic.trim()) {
          text += `*الدرس النظري/التجويدي:* ${lessonTopic.trim()}\n`;
        }
        text += `-----------------------------------\n\n`;

        if (students.length === 0) {
          text += `لا يوجد طلاب مسجلون في هذه الحلقة.`;
          return text;
        }

        students.forEach((st, idx) => {
          const evalDoc = todayEvaluations.find(e => e.studentId === st.id);
          const isAbsent = absentStudents[st.id];

          text += `${idx + 1}. *${st.name}*`;

          if (isAbsent) {
            text += ` *(غائب)*\n\n`;
          } else if (evalDoc && !evalDoc.isAbsent) {
            text += `:\n`;
            if (evalDoc.recitations && evalDoc.recitations.length > 0) {
              evalDoc.recitations.forEach(r => {
                text += `  - سورة ${r.surah}: ${r.rating}\n`;
              });
            } else if (evalDoc.surah) {
              text += `  - سورة ${evalDoc.surah}: ${evalDoc.rating}\n`;
            }
            text += `  - السلوك: ${evalDoc.behavior}\n\n`;
          } else {
            text += `:\n  - (حاضر - لم يسمّع اليوم)\n\n`;
          }
        });

        text += `انتهى التقرير. جزاكم الله خيراً 🌟`;
        return text;
      };

      const copyWhatsappText = () => {
        const text = generateWhatsappText();
        navigator.clipboard.writeText(text);
        alert("تم نسخ التقرير النصي بنجاح! يمكنك الآن لصقه في الواتساب.");
      };

      return (
        <div className="space-y-4">
          {/* تنبيه للمتصفح العادي */}
          {!canEdit && (
            <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs font-bold text-center">
              👀 أنت تتصفح التطبيق بحساب (قراءة فقط). لتعديل أو إضافة حلقات، تواصل مع أدمن التطبيق لترقية حسابك إلى مشرف.
            </div>
          )}

          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
            <div className="flex flex-wrap gap-2 items-center">
              <label className="text-xs font-bold text-gray-600">اختر الحلقة:</label>
              <select value={selectedCircleId} onChange={e => setSelectedCircleId(e.target.value)} className="flex-1 min-w-[180px] p-2 border rounded-lg text-sm font-bold">
                {circles.length === 0 ? <option>لا يوجد حلقات متاحة</option> : circles.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>

              {canEdit && selectedCircleObj && (
                <div className="flex gap-1">
                  <button onClick={() => editCircleName(selectedCircleObj)} title="تعديل اسم الحلقة" className="bg-amber-50 text-amber-700 border border-amber-300 p-2 rounded-lg text-xs font-bold hover:bg-amber-100">✏️</button>
                  <button onClick={() => deleteCircle(selectedCircleObj)} title="حذف الحلقة" className="bg-red-50 text-red-700 border border-red-300 p-2 rounded-lg text-xs font-bold hover:bg-red-100">🗑️</button>
                </div>
              )}
            </div>

            {canEdit && (
              <div className="flex gap-2 pt-2 border-t">
                <input type="text" placeholder="اسم حلقة جديدة" value={newCircleName} onChange={e => setNewCircleName(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm" />
                <button onClick={addCircle} className="bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-800">+ إضافة حلقة</button>
              </div>
            )}

            <div className="flex items-center gap-2 pt-2 border-t">
              <label className="text-xs font-bold text-gray-600">التاريخ:</label>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-1.5 border rounded-lg text-xs font-bold" />
              <span className="text-xs text-gray-500 font-bold bg-gray-100 px-2 py-1 rounded">({formatDateToArabic(date)})</span>
            </div>
          </div>

          <div className="bg-white p-4 rounded-xl shadow-sm space-y-2 border">
            <h3 className="font-bold text-emerald-800 text-sm flex items-center gap-1">
              📚 الدرس النظري / التجويدي لليوم
            </h3>
            <input 
              type="text" 
              readOnly={!canEdit}
              placeholder={canEdit ? "مثال: أحكام النون الساكنة والتنوين" : "لم يحدد درس اليوم بعد"} 
              value={lessonTopic} 
              onChange={e => saveLessonTopic(e.target.value)}
              className={`w-full p-2 border rounded-lg text-sm ${canEdit ? 'bg-gray-50 focus:bg-white' : 'bg-gray-100 text-gray-600'}`}
            />
          </div>

          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
            <h3 className="font-bold text-gray-700 text-sm">قائمة الطلاب ({students.length})</h3>
            
            {canEdit && (
              <div className="flex gap-2">
                <input type="text" placeholder="اسم طالب جديد" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm" />
                <button onClick={addStudent} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-800">+ إضافة طالب</button>
              </div>
            )}

            <div className="divide-y pt-2">
              {students.map(st => {
                const evalDoc = todayEvaluations.find(e => e.studentId === st.id);
                const isAbsent = !!absentStudents[st.id];

                return (
                  <div key={st.id} className={`py-2.5 flex justify-between items-center ${isAbsent ? 'bg-red-50/50 px-2 rounded-lg' : ''}`}>
                    <div className="flex items-center gap-3">
                      {canEdit ? (
                        <label className="flex items-center gap-1.5 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={!isAbsent} 
                            onChange={() => toggleAttendance(st)}
                            className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer"
                          />
                          <span className={`text-xs font-bold ${isAbsent ? 'text-red-600' : 'text-emerald-700'}`}>
                            {isAbsent ? 'غائب ❌' : 'حاضر ✓'}
                          </span>
                        </label>
                      ) : (
                        <span className={`text-xs font-bold ${isAbsent ? 'text-red-600' : 'text-emerald-700'}`}>
                          {isAbsent ? 'غائب ❌' : 'حاضر ✓'}
                        </span>
                      )}

                      <div>
                        <span className={`font-bold text-sm ${isAbsent ? 'text-gray-400 line-through' : 'text-gray-800'}`}>
                          {st.name}
                        </span>
                        {evalDoc && !isAbsent && evalDoc.recitations && evalDoc.recitations.length > 0 && (
                          <span className="text-[11px] text-emerald-600 font-semibold block mt-0.5">
                            ✓ تم التقييم لليوم
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="flex gap-2 items-center">
                      {!isAbsent && canEdit && (
                        <button onClick={() => setActiveModalStudent(st)} className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-700 shadow">
                          {evalDoc && evalDoc.recitations && evalDoc.recitations.length > 0 ? 'تعديل التقييم 📝' : 'إضافة تقييم اليوم 📝'}
                        </button>
                      )}
                      {canEdit && (
                        <button onClick={() => deleteStudent(st.id)} className="text-red-400 hover:text-red-600 text-xs px-1">حذف</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-gray-700 text-sm flex items-center gap-1">
                💬 التقرير الجاهز للإرسال (واتساب)
              </h3>
              <button onClick={copyWhatsappText} className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow flex items-center gap-1">
                📋 نسخ النص
              </button>
            </div>

            <textarea 
              readOnly 
              rows="8" 
              value={generateWhatsappText()} 
              className="w-full p-3 border rounded-lg font-mono text-xs bg-gray-50 text-gray-700 leading-relaxed"
            />
          </div>

          {activeModalStudent && (
            <EvalModal 
              student={activeModalStudent} 
              circleId={selectedCircleId}
              circleName={selectedCircleObj ? selectedCircleObj.name : ''}
              date={date} 
              existingEval={todayEvaluations.find(e => e.studentId === activeModalStudent.id)}
              onClose={() => setActiveModalStudent(null)} 
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 7. نافذة إضافة تقييم
    // ==========================================
    function EvalModal({ student, circleId, circleName, date, existingEval, onClose }) {
      const [recitations, setRecitations] = React.useState(
        existingEval && existingEval.recitations && existingEval.recitations.length > 0
          ? existingEval.recitations 
          : [{ surah: JUZ_AMMA[0], rating: 'ممتاز' }]
      );
      const [behavior, setBehavior] = React.useState(existingEval ? existingEval.behavior : 'جيد');
      const [saving, setSaving] = React.useState(false);

      const addSurahRow = () => {
        setRecitations([...recitations, { surah: JUZ_AMMA[0], rating: 'ممتاز' }]);
      };

      const removeSurahRow = (index) => {
        if (recitations.length === 1) return;
        setRecitations(recitations.filter((_, i) => i !== index));
      };

      const updateRecitation = (index, field, value) => {
        const updated = [...recitations];
        updated[index][field] = value;
        setRecitations(updated);
      };

      const save = async () => {
        setSaving(true);
        try {
          if (existingEval) {
            await db.collection('evaluations').doc(existingEval.id).update({
              recitations: recitations,
              behavior: behavior,
              isAbsent: false,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            await db.collection('evaluations').add({
              studentId: student.id,
              studentName: student.name,
              circleId: circleId,
              circleName: circleName,
              date,
              isAbsent: false,
              recitations: recitations,
              behavior: behavior,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          alert(`تم حفظ تقييم الطالب (${student.name}) بنجاح!`);
          onClose();
        } catch(e) {
          alert("خطأ أثناء الحفظ: " + e.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-xl max-w-md w-full space-y-4 max-h-[90vh] flex flex-col">
            <h3 className="font-bold text-emerald-800 text-base border-b pb-2">تقييم اليوم: {student.name} ({formatDateToArabic(date)})</h3>
            
            <div className="flex-1 overflow-y-auto space-y-3 pl-1">
              <div className="flex justify-between items-center">
                <label className="text-xs font-bold text-gray-700">السور المسمّعة:</label>
                <button onClick={addSurahRow} className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold px-2 py-1 rounded-lg hover:bg-emerald-100">+ سورة أخرى</button>
              </div>

              {recitations.map((item, idx) => (
                <div key={idx} className="bg-gray-50 p-3 rounded-lg border space-y-2 relative">
                  {recitations.length > 1 && (
                    <button onClick={() => removeSurahRow(idx)} className="absolute top-1 left-2 text-red-500 font-bold text-xs">✕</button>
                  )}
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">اختر السورة:</label>
                    <select value={item.surah} onChange={e => updateRecitation(idx, 'surah', e.target.value)} className="w-full p-1.5 border rounded text-xs font-bold">
                      {JUZ_AMMA.map(s => <option key={s} value={s}>سورة {s}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">تقييم الحفظ:</label>
                    <div className="flex gap-1">
                      {['إعادة', 'جيد', 'جيد جداً', 'ممتاز'].map(r => (
                        <button key={r} onClick={() => updateRecitation(idx, 'rating', r)} className={`flex-1 p-1 text-[11px] border rounded font-bold ${item.rating === r ? 'bg-emerald-600 text-white' : 'bg-white text-gray-700'}`}>{r}</button>
                      ))}
                    </div>
                  </div>
                </div>
              ))}

              <div className="pt-2">
                <label className="block text-xs font-bold text-gray-700 mb-1">تقييم السلوك لليوم:</label>
                <div className="flex gap-2">
                  {['جيد', 'بحاجة تحسين'].map(b => (
                    <button key={b} onClick={() => setBehavior(b)} className={`flex-1 p-2 text-xs border rounded-lg font-bold ${behavior === b ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-700'}`}>{b}</button>
                  ))}
                </div>
              </div>
            </div>

            <div className="pt-2 space-y-2 border-t">
              <button disabled={saving} onClick={save} className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700 disabled:opacity-50">
                {saving ? 'جاري الحفظ...' : 'حفظ التقييم الإجمالي'}
              </button>
              <button onClick={onClose} className="w-full bg-gray-100 text-gray-600 py-1.5 rounded-lg text-sm font-bold">إغلاق</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. لائحة البيانات العامة (التراكمية)
    // ==========================================
    function GlobalDatabaseView() {
      const [circles, setCircles] = React.useState([]);
      const [students, setStudents] = React.useState([]);
      const [evaluations, setEvaluations] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const fetchData = async () => {
          const cSnap = await db.collection('circles').get();
          const sSnap = await db.collection('students').get();
          const eSnap = await db.collection('evaluations').get();

          setCircles(cSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setStudents(sSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setEvaluations(eSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        };
        fetchData();
      }, []);

      const calculateGeneralBehavior = (studentEvals) => {
        const validEvals = studentEvals.filter(e => !e.isAbsent);
        if (validEvals.length === 0) return 'لا يوجد تقييمات';
        let goodCount = 0;
        let needsImpCount = 0;

        validEvals.forEach(e => {
          if (e.behavior === 'جيد') goodCount++;
          if (e.behavior === 'بحاجة تحسين') needsImpCount++;
        });

        return goodCount >= needsImpCount ? 'السلوك العام: جيد' : 'السلوك العام: بحاجة تحسين';
      };

      if (loading) return <div className="text-center py-10 font-bold text-emerald-800">جاري تحميل لائحة البيانات العامة...</div>;

      return (
        <div className="space-y-6">
          <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
            <h2 className="text-lg font-bold text-emerald-900">📊 السجل التراكمي العام للمساجد</h2>
            <p className="text-xs text-emerald-700 mt-1">عرض السور المسمّعة والسلوك العام لجميع الطلاب</p>
          </div>

          {circles.map(circle => {
            const circleStudents = students.filter(s => s.circleId === circle.id);
            return (
              <div key={circle.id} className="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div className="bg-emerald-800 text-white px-4 py-2 font-bold text-sm flex justify-between">
                  <span>🕌 حلقة: {circle.name}</span>
                  <span className="text-xs font-normal opacity-80">{circle.masjidId || 'مسجد عام'}</span>
                </div>

                <div className="p-4 space-y-4 divide-y">
                  {circleStudents.length === 0 ? (
                    <p className="text-xs text-gray-400">لا يوجد طلاب مسجلون في هذه الحلقة.</p>
                  ) : (
                    circleStudents.map(student => {
                      const studentEvals = evaluations.filter(e => e.studentId === student.id && !e.isAbsent);
                      const generalBehavior = calculateGeneralBehavior(studentEvals);

                      return (
                        <div key={student.id} className="pt-3 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-base text-gray-800">👤 {student.name}</span>
                            <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${generalBehavior.includes('جيد') ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                              {generalBehavior}
                            </span>
                          </div>

                          <div className="bg-gray-50 p-3 rounded-lg border text-xs space-y-1.5">
                            <span className="font-bold text-gray-600 block mb-1">📖 السور المسمّعة والتاريخ:</span>
                            {studentEvals.length === 0 ? (
                              <span className="text-gray-400">لم يقم بالتسميع بعد.</span>
                            ) : (
                              studentEvals.map((ev, i) => (
                                <div key={i} className="flex flex-wrap items-center gap-2 border-b border-gray-200 pb-1 last:border-0">
                                  <span className="text-gray-400 font-mono">[{formatDateToArabic(ev.date)}]</span>
                                  {ev.recitations && ev.recitations.length > 0 ? (
                                    ev.recitations.map((r, rIdx) => (
                                      <span key={rIdx} className="bg-white px-2 py-0.5 border rounded font-semibold text-emerald-800">
                                        سورة {r.surah} ({r.rating})
                                      </span>
                                    ))
                                  ) : ev.surah ? (
                                    <span className="bg-white px-2 py-0.5 border rounded font-semibold text-emerald-800">
                                      سورة {ev.surah} ({ev.rating})
                                    </span>
                                  ) : null}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
