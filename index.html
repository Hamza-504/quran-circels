<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة حلقات القرآن الكريم</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. إعدادات Firebase
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBCzlYbSq6ocwpDzhEeEZr0eDrg6cM3ecc",
      authDomain: "hamod-naser.firebaseapp.com",
      projectId: "hamod-naser",
      storageBucket: "hamod-naser.firebasestorage.app",
      messagingSenderId: "337847802811",
      appId: "1:337847802811:web:7e6c5989a4137310bc029e",
      measurementId: "G-YTXZNQ59QR"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const formatDateToArabic = (dateString) => {
      if (!dateString) return '';
      const [year, month, day] = dateString.split('-');
      return `${day}/${month}/${year}`;
    };

    const JUZ_AMMA = [
      'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين', 'الانشقاق', 'البروج', 
      'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'الليل', 'الضحى', 
      'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 
      'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 
      'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'
    ];

    // ==========================================
    // 2. التطبيق الرئيسي
    // ==========================================
    function App() {
      const [user, setUser] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async (u) => {
          setUser(u);
          if (u) {
            const docRef = db.collection('users').doc(u.uid);
            const docSnap = await docRef.get();
            if (docSnap.exists) {
              setUserProfile(docSnap.data());
            } else {
              setUserProfile({
                uid: u.uid,
                email: u.email,
                username: u.email.split('@')[0],
                role: 'viewer',
                masjidId: null
              });
            }
          } else {
            setUserProfile(null);
          }
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) return (
        <div className="flex flex-col justify-center items-center h-screen bg-emerald-900 text-white font-bold gap-3">
          <div className="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
          <span>جاري تحميل المنظومة...</span>
        </div>
      );

      return user && userProfile ? <MainLayout user={user} userProfile={userProfile} /> : <AuthScreen />;
    }

    // ==========================================
    // 3. شاشة تسجيل الدخول
    // ==========================================
    function AuthScreen() {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [username, setUsername] = React.useState('');
      const [isSignUp, setIsSignUp] = React.useState(false);
      const [loading, setLoading] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);

        try {
          if (isSignUp) {
            const cleanUsername = username.trim().toLowerCase().replace(/\s+/g, '_');
            if (!cleanUsername) {
              setLoading(false);
              return alert("يرجى إدخال المعرّف الخاص!");
            }

            const checkSnap = await db.collection('users').where('username', '==', cleanUsername).get();
            if (!checkSnap.empty) {
              setLoading(false);
              return alert("المعرّف الخاص مستخدم بالفعل!");
            }

            const res = await auth.createUserWithEmailAndPassword(email, password);
            await db.collection('users').doc(res.user.uid).set({
              uid: res.user.uid,
              email: email,
              username: cleanUsername,
              role: 'viewer',
              masjidId: null,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          alert("خطأ: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleGoogleSignIn = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const res = await auth.signInWithPopup(provider);
          
          const docRef = db.collection('users').doc(res.user.uid);
          const docSnap = await docRef.get();
          if (!docSnap.exists) {
            const defaultUser = res.user.email.split('@')[0].toLowerCase();
            await docRef.set({
              uid: res.user.uid,
              email: res.user.email,
              username: defaultUser,
              role: 'viewer',
              masjidId: null,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } catch (err) {
          alert("خطأ أثناء تسجيل الدخول بـ Google: " + err.message);
        }
      };

      return (
        <div className="flex items-center justify-center min-h-screen p-4 bg-gray-100">
          <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full space-y-4 border border-gray-100">
            <div className="text-center space-y-1">
              <h2 className="text-2xl font-black text-emerald-800 flex items-center justify-center gap-2">
                <span>🕌</span> المنظومة القرآنية
              </h2>
              <p className="text-xs text-gray-500 font-bold">
                {isSignUp ? 'إنشاء حساب مستخدم جديد' : 'تسجيل الدخول للنظام'}
              </p>
            </div>

            <button 
              onClick={handleGoogleSignIn}
              type="button"
              className="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-xl font-bold shadow-sm hover:bg-gray-50 transition text-xs"
            >
              <svg className="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>المتابعة عبر Google</span>
            </button>

            <div className="flex items-center my-2">
              <div className="flex-1 border-t border-gray-200"></div>
              <span className="px-3 text-[11px] text-gray-400 font-bold">أو البريد الإلكتروني</span>
              <div className="flex-1 border-t border-gray-200"></div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              {isSignUp && (
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">اسم المستخدم (Username)</label>
                  <div className="flex items-center border rounded-lg overflow-hidden bg-gray-50 px-2 focus-within:ring-2 ring-emerald-500">
                    <span className="text-gray-400 font-bold text-sm">@</span>
                    <input 
                      type="text" 
                      required 
                      placeholder="مثال: ahmed_homs" 
                      value={username} 
                      onChange={e => setUsername(e.target.value)} 
                      className="w-full p-2 bg-transparent text-sm focus:outline-none" 
                    />
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2 border rounded-lg text-sm focus:ring-2 ring-emerald-500 outline-none" />
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">كلمة المرور 🔒</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2 border rounded-lg text-sm focus:ring-2 ring-emerald-500 outline-none" />
              </div>

              <button disabled={loading} type="submit" className="w-full bg-emerald-700 text-white py-2.5 rounded-lg font-bold shadow-md hover:bg-emerald-800 transition disabled:opacity-50 text-sm">
                {loading ? 'جاري التحقق...' : (isSignUp ? 'إنشاء حساب محمي' : 'تسجيل الدخول')}
              </button>
            </form>

            <button onClick={() => setIsSignUp(!isSignUp)} className="w-full text-xs text-emerald-800 font-bold underline text-center block pt-1">
              {isSignUp ? 'لديك حساب بالفعل؟ سجل دخولك' : 'حساب جديد؟ اضغط هنا للإنشاء'}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. الهيكل الرئيسي مع الشريط العلوي
    // ==========================================
    function MainLayout({ user, userProfile }) {
      const [currentView, setCurrentView] = React.useState('dashboard');
      const role = (userProfile.role || 'viewer').toLowerCase();

      const roleBadgeColor = {
        admin: 'bg-red-600 text-white ring-2 ring-red-300',
        supervisor: 'bg-emerald-600 text-white ring-2 ring-emerald-300',
        viewer: 'bg-gray-500 text-white'
      }[role] || 'bg-gray-400 text-white';

      const roleBadgeText = {
        admin: '👑 مطور بالنظام (Admin)',
        supervisor: `🕌 مشرف (${userProfile.masjidId || 'جامع حمود الناصر'})`,
        viewer: '👁️ متصفح'
      }[role];

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-emerald-900 text-white px-4 md:px-8 py-3.5 shadow-lg flex justify-between items-center sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🕌</span>
              <div>
                <h1 className="font-bold text-sm md:text-base leading-tight">إدارة حلقات المساجد</h1>
                <div className="flex items-center gap-2 mt-0.5">
                  <span className={`text-[10px] px-2 py-0.5 rounded font-black shadow-sm ${roleBadgeColor}`}>
                    @{userProfile.username} - {roleBadgeText}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {role === 'admin' && (
                <button 
                  onClick={() => setCurrentView('users_admin')} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold shadow transition border flex items-center gap-1 ${currentView === 'users_admin' ? 'bg-amber-500 text-white border-amber-400' : 'bg-emerald-800 hover:bg-emerald-700 text-white border-emerald-600'}`}
                >
                  <span>⚙️</span>
                  <span className="hidden sm:inline">لوحة الإدارة والمساجد</span>
                </button>
              )}

              {currentView === 'dashboard' ? (
                <button 
                  onClick={() => setCurrentView('global_db')} 
                  className="bg-emerald-800 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition border border-emerald-600 flex items-center gap-1"
                >
                  <span>📊</span>
                  <span className="hidden sm:inline">السجل التراكمي</span>
                </button>
              ) : (
                <button 
                  onClick={() => setCurrentView('dashboard')} 
                  className="bg-emerald-800 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition border border-emerald-600 flex items-center gap-1"
                >
                  <span>🏠</span>
                  <span className="hidden sm:inline">إدارة الحلقات</span>
                </button>
              )}
              
              <button 
                onClick={() => auth.signOut()} 
                className="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow"
              >
                خروج
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
            {currentView === 'dashboard' && <Dashboard userProfile={userProfile} />}
            {currentView === 'global_db' && <GlobalDatabaseView userProfile={userProfile} />}
            {currentView === 'users_admin' && role === 'admin' && <AdminUsersPanel />}
          </main>
        </div>
      );
    }

    // ==========================================
    // 5. لوحة المطور الاحترافية (إدارة المساجد والمشرفين)
    // ==========================================
    function AdminUsersPanel() {
      const [usersList, setUsersList] = React.useState([]);
      const [circlesCount, setCirclesCount] = React.useState(0);
      const [studentsCount, setStudentsCount] = React.useState(0);
      const [loading, setLoading] = React.useState(true);
      const [searchTerm, setSearchTerm] = React.useState('');

      React.useEffect(() => {
        const unsubUsers = db.collection('users').onSnapshot(snap => {
          setUsersList(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        });

        db.collection('circles').get().then(snap => setCirclesCount(snap.size));
        db.collection('students').get().then(snap => setStudentsCount(snap.size));

        return () => unsubUsers();
      }, []);

      const updateUserRoleAndMasjid = async (userDoc) => {
        const currentRole = (userDoc.role || 'viewer').toLowerCase();
        const newRole = prompt("اختر الدور الجديد للمستخدم (admin / supervisor / viewer):", currentRole);
        if (!newRole) return;

        const cleanRole = newRole.trim().toLowerCase();
        if (!['admin', 'supervisor', 'viewer'].includes(cleanRole)) {
          return alert("دور غير صالح! يرجى كتابة admin أو supervisor أو viewer.");
        }

        let masjidId = userDoc.masjidId;
        if (cleanRole === 'supervisor') {
          masjidId = prompt("أدخل اسم المسجد المخصص لهذا المشرف:", userDoc.masjidId || "جامع حمود الناصر");
          if (!masjidId) masjidId = "جامع حمود الناصر";
        }

        try {
          await db.collection('users').doc(userDoc.id).update({
            role: cleanRole,
            masjidId: cleanRole === 'supervisor' ? masjidId : (cleanRole === 'admin' ? 'كل المساجد' : null)
          });
          alert("تم تحديث حساب المستخدم بنجاح!");
        } catch (e) {
          alert("حدث خطأ أثناء التحديث: " + e.message);
        }
      };

      const editMasjidNameDirectly = async (userDoc) => {
        const newMasjid = prompt("تعديل اسم المسجد المخصص لهذا المشرف:", userDoc.masjidId || "جامع حمود الناصر");
        if (newMasjid && newMasjid.trim()) {
          await db.collection('users').doc(userDoc.id).update({
            masjidId: newMasjid.trim()
          });
          alert("تم التحديث!");
        }
      };

      if (loading) return <div className="text-center py-12 font-bold text-emerald-800">جاري التحميل...</div>;

      const supervisors = usersList.filter(u => (u.role || '').toLowerCase() === 'supervisor');
      const uniqueMasjids = Array.from(new Set(supervisors.map(s => s.masjidId).filter(Boolean)));
      
      const filteredUsers = usersList.filter(u => 
        (u.username || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
        (u.email || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
        (u.masjidId || '').toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div className="space-y-6">
          {/* كروت الإحصائيات العامة */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
              <span className="text-2xl">🕌</span>
              <div className="text-xl font-black text-gray-800 mt-1">{uniqueMasjids.length || 1}</div>
              <div className="text-xs text-gray-500 font-bold">المساجد المسجلة</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
              <span className="text-2xl">👨‍🏫</span>
              <div className="text-xl font-black text-emerald-700 mt-1">{supervisors.length}</div>
              <div className="text-xs text-gray-500 font-bold">المشرفين النشطين</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
              <span className="text-2xl">📖</span>
              <div className="text-xl font-black text-blue-700 mt-1">{circlesCount}</div>
              <div className="text-xs text-gray-500 font-bold">الحلقات القرآنية</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
              <span className="text-2xl">👥</span>
              <div className="text-xl font-black text-purple-700 mt-1">{studentsCount}</div>
              <div className="text-xs text-gray-500 font-bold">إجمالي الطلاب</div>
            </div>
          </div>

          {/* لوحة التحكم بالمستخدمين */}
          <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <div className="flex flex-wrap justify-between items-center gap-2 border-b pb-4">
              <div>
                <h2 className="text-lg font-bold text-red-700 flex items-center gap-2">
                  <span>⚙️</span> إدارة الصلاحيات والمساجد والمشرفين
                </h2>
                <p className="text-xs text-gray-500">من هنا يمكنك إعطاء الصلاحيات وتعيين مشرف كل مسجد</p>
              </div>

              <input 
                type="text" 
                placeholder="بحث عن مستخدم أو مسجد..." 
                value={searchTerm} 
                onChange={e => setSearchTerm(e.target.value)} 
                className="p-2 border rounded-xl text-xs font-bold w-full sm:w-64 focus:ring-2 ring-emerald-500 outline-none" 
              />
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs">
                <thead>
                  <tr className="bg-gray-50 text-gray-600 font-bold border-b">
                    <th className="p-3">المستخدم</th>
                    <th className="p-3">البريد الإلكتروني</th>
                    <th className="p-3">الدور الحسابي</th>
                    <th className="p-3">المسجد المخصص</th>
                    <th className="p-3 text-center">الإجراءات</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  {filteredUsers.map(u => {
                    const uRole = (u.role || 'viewer').toLowerCase();
                    return (
                      <tr key={u.id} className="hover:bg-gray-50 transition">
                        <td className="p-3 font-bold text-gray-800">@{u.username || 'بدون'}</td>
                        <td className="p-3 text-gray-500">{u.email}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded font-black text-[10px] ${uRole === 'admin' ? 'bg-red-100 text-red-800' : (uRole === 'supervisor' ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-700')}`}>
                            {uRole === 'admin' ? 'مطور Admin' : (uRole === 'supervisor' ? 'مشرف Supervisor' : 'متصفح Viewer')}
                          </span>
                        </td>
                        <td className="p-3 font-bold">
                          {uRole === 'supervisor' ? (
                            <div className="flex items-center gap-1 text-emerald-800">
                              <span>🕌 {u.masjidId || 'جامع حمود الناصر'}</span>
                              <button onClick={() => editMasjidNameDirectly(u)} className="text-[10px] text-gray-400 hover:text-emerald-700">✏️</button>
                            </div>
                          ) : (
                            <span className="text-gray-400">{uRole === 'admin' ? 'كل المساجد 🌐' : 'غير مخصص'}</span>
                          )}
                        </td>
                        <td className="p-3 text-center">
                          <button 
                            onClick={() => updateUserRoleAndMasjid(u)}
                            className="bg-gray-100 hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-lg font-bold text-xs transition"
                          >
                            تعديل الصلاحية / المسجد ✏️
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. لوحة التحكم الرئيسية (ادارة الحلقات والطلاب)
    // ==========================================
    function Dashboard({ userProfile }) {
      const [circles, setCircles] = React.useState([]);
      const [selectedCircleId, setSelectedCircleId] = React.useState('');
      const [newCircleName, setNewCircleName] = React.useState('');
      const [students, setStudents] = React.useState([]);
      const [newStudentName, setNewStudentName] = React.useState('');
      const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
      
      const [selectedMasjidFilter, setSelectedMasjidFilter] = React.useState('ALL');
      const [lessonTopic, setLessonTopic] = React.useState('');
      const [todayEvaluations, setTodayEvaluations] = React.useState([]);
      const [absentStudents, setAbsentStudents] = React.useState({});
      const [activeModalStudent, setActiveModalStudent] = React.useState(null);

      const role = (userProfile.role || 'viewer').toLowerCase();
      const canEdit = role === 'admin' || role === 'supervisor';

      React.useEffect(() => {
        const unsub = db.collection('circles').onSnapshot(snap => {
          let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          
          if (role === 'supervisor') {
            const myMasjid = userProfile.masjidId || 'جامع حمود الناصر';
            list = list.filter(c => !c.masjidId || c.masjidId === myMasjid);
          } else if (role === 'admin' && selectedMasjidFilter !== 'ALL') {
            list = list.filter(c => c.masjidId === selectedMasjidFilter);
          }

          setCircles(list);
          if (list.length > 0 && (!selectedCircleId || !list.find(c => c.id === selectedCircleId))) {
            setSelectedCircleId(list[0].id);
          } else if (list.length === 0) {
            setSelectedCircleId('');
          }
        });
        return () => unsub();
      }, [userProfile, role, selectedMasjidFilter]);

      React.useEffect(() => {
        if (!selectedCircleId) { 
          setStudents([]); 
          setTodayEvaluations([]); 
          setLessonTopic('');
          setAbsentStudents({});
          return; 
        }

        const unsubStudents = db.collection('students')
          .where('circleId', '==', selectedCircleId)
          .onSnapshot(snap => {
            setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

        const unsubEvals = db.collection('evaluations')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .onSnapshot(snap => {
            const evals = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setTodayEvaluations(evals);
            
            const absentMap = {};
            evals.forEach(e => {
              if (e.isAbsent) absentMap[e.studentId] = true;
            });
            setAbsentStudents(absentMap);
          });

        const unsubLesson = db.collection('lessons')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .onSnapshot(snap => {
            if (!snap.empty) {
              setLessonTopic(snap.docs[0].data().topic || '');
            } else {
              setLessonTopic('');
            }
          });

        return () => {
          unsubStudents();
          unsubEvals();
          unsubLesson();
        };
      }, [selectedCircleId, date]);

      const addCircle = async () => {
        if (!canEdit || !newCircleName.trim()) return;
        const targetMasjid = role === 'admin' 
          ? (selectedMasjidFilter === 'ALL' ? 'جامع حمود الناصر' : selectedMasjidFilter)
          : (userProfile.masjidId || 'جامع حمود الناصر');

        await db.collection('circles').add({ 
          name: newCircleName.trim(), 
          masjidId: targetMasjid,
          createdBy: userProfile.username 
        });
        setNewCircleName('');
      };

      const editCircleName = async (circle) => {
        if (!canEdit) return;
        const updated = prompt("أدخل الاسم الجديد للحلقة:", circle.name);
        if (updated && updated.trim()) {
          await db.collection('circles').doc(circle.id).update({ name: updated.trim() });
        }
      };

      const deleteCircle = async (circle) => {
        if (!canEdit) return;
        if (!confirm(`هل أنت تأكد من حذف حلقة (${circle.name})؟`)) return;
        await db.collection('circles').doc(circle.id).delete();
        setSelectedCircleId('');
      };

      const addStudent = async () => {
        if (!canEdit || !newStudentName.trim() || !selectedCircleId) return;
        await db.collection('students').add({ name: newStudentName.trim(), circleId: selectedCircleId });
        setNewStudentName('');
      };

      const deleteStudent = async (id) => {
        if (!canEdit) return;
        if (confirm("هل أنت تأكد من حذف هذا الطالب؟")) {
          await db.collection('students').doc(id).delete();
        }
      };

      const toggleAttendance = async (student) => {
        if (!canEdit) return;
        const isCurrentlyAbsent = !!absentStudents[student.id];
        const newAbsentState = !isCurrentlyAbsent;

        setAbsentStudents(prev => ({ ...prev, [student.id]: newAbsentState }));

        const existingEval = todayEvaluations.find(e => e.studentId === student.id);
        if (existingEval) {
          await db.collection('evaluations').doc(existingEval.id).update({
            isAbsent: newAbsentState
          });
        } else {
          await db.collection('evaluations').add({
            studentId: student.id,
            studentName: student.name,
            circleId: selectedCircleId,
            circleName: selectedCircleObj ? selectedCircleObj.name : '',
            date,
            isAbsent: newAbsentState,
            recitations: [],
            behavior: 'جيد',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      };

      const saveLessonTopic = async (topicValue) => {
        setLessonTopic(topicValue);
        if (!canEdit || !selectedCircleId) return;
        
        const snap = await db.collection('lessons')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .get();

        if (snap.empty) {
          await db.collection('lessons').add({
            circleId: selectedCircleId,
            date: date,
            topic: topicValue
          });
        } else {
          await db.collection('lessons').doc(snap.docs[0].id).update({ topic: topicValue });
        }
      };

      const selectedCircleObj = circles.find(c => c.id === selectedCircleId);

      const generateWhatsappText = () => {
        if (!selectedCircleObj) return '';

        let text = `السلام عليكم ورحمة الله وبركاته\n*تقرير حلقة: ${selectedCircleObj.name}*\n`;
        text += `*المسجد:* ${selectedCircleObj.masjidId || 'مسجد عام'}\n`;
        text += `*التاريخ:* ${formatDateToArabic(date)}\n`;
        if (lessonTopic.trim()) {
          text += `*الدرس النظري/التجويدي:* ${lessonTopic.trim()}\n`;
        }
        text += `-----------------------------------\n\n`;

        if (students.length === 0) {
          text += `لا يوجد طلاب مسجلون في هذه الحلقة.`;
          return text;
        }

        students.forEach((st, idx) => {
          const evalDoc = todayEvaluations.find(e => e.studentId === st.id);
          const isAbsent = absentStudents[st.id];

          text += `${idx + 1}. *${st.name}*`;

          if (isAbsent) {
            text += ` *(غائب)*\n\n`;
          } else if (evalDoc && !evalDoc.isAbsent) {
            text += `:\n`;
            if (evalDoc.recitations && evalDoc.recitations.length > 0) {
              evalDoc.recitations.forEach(r => {
                text += `  - سورة ${r.surah}: ${r.rating}\n`;
              });
            } else if (evalDoc.surah) {
              text += `  - سورة ${evalDoc.surah}: ${evalDoc.rating}\n`;
            }
            text += `  - السلوك: ${evalDoc.behavior}\n\n`;
          } else {
            text += `:\n  - (حاضر - لم يسمّع اليوم)\n\n`;
          }
        });

        text += `انتهى التقرير. جزاكم الله خيراً 🌟`;
        return text;
      };

      const copyWhatsappText = () => {
        const text = generateWhatsappText();
        navigator.clipboard.writeText(text);
        alert("تم نسخ التقرير النصي بنجاح! يمكنك الآن لصقه في الواتساب.");
      };

      return (
        <div className="space-y-4">
          {!canEdit && (
            <div className="bg-amber-50 border border-amber-200 text-amber-900 p-3 rounded-xl text-xs font-bold text-center">
              👀 أنت تتصفح التطبيق وضع (القراءة فقط). لتعديل البيانات، تواصل مع الأدمن لترقية حسابك إلى مشرف.
            </div>
          )}

          {/* ترويسة اختيار المسجد والحلقة */}
          <div className="bg-white p-5 rounded-2xl shadow-sm space-y-4 border border-gray-200">
            {role === 'admin' && (
              <div className="flex items-center gap-2 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200">
                <span className="text-xs font-black text-emerald-900">🌐 تصفح بصلاحية المطور:</span>
                <select 
                  value={selectedMasjidFilter} 
                  onChange={e => setSelectedMasjidFilter(e.target.value)}
                  className="flex-1 p-1.5 border rounded-lg text-xs font-bold bg-white text-emerald-900 outline-none"
                >
                  <option value="ALL">عرض كل المساجد والحلقات</option>
                  <option value="جامع حمود الناصر">جامع حمود الناصر</option>
                </select>
              </div>
            )}

            <div className="flex flex-wrap gap-2 items-center">
              <label className="text-xs font-bold text-gray-700">اختر الحلقة القرآنية:</label>
              <select value={selectedCircleId} onChange={e => setSelectedCircleId(e.target.value)} className="flex-1 min-w-[200px] p-2 border rounded-xl text-sm font-bold bg-gray-50 focus:bg-white outline-none">
                {circles.length === 0 ? <option>لا يوجد حلقات متاحة حالياً</option> : circles.map(c => <option key={c.id} value={c.id}>{c.name} ({c.masjidId || 'مسجد عام'})</option>)}
              </select>

              {canEdit && selectedCircleObj && (
                <div className="flex gap-1">
                  <button onClick={() => editCircleName(selectedCircleObj)} title="تعديل اسم الحلقة" className="bg-amber-50 text-amber-700 border border-amber-300 p-2 rounded-xl text-xs font-bold hover:bg-amber-100">✏️</button>
                  <button onClick={() => deleteCircle(selectedCircleObj)} title="حذف الحلقة" className="bg-red-50 text-red-700 border border-red-300 p-2 rounded-xl text-xs font-bold hover:bg-red-100">🗑️</button>
                </div>
              )}
            </div>

            {canEdit && (
              <div className="flex gap-2 pt-2 border-t">
                <input type="text" placeholder="اسم حلقة جديدة" value={newCircleName} onChange={e => setNewCircleName(e.target.value)} className="flex-1 p-2 border rounded-xl text-sm focus:ring-2 ring-emerald-500 outline-none" />
                <button onClick={addCircle} className="bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow hover:bg-emerald-800 transition">+ إضافة حلقة</button>
              </div>
            )}

            <div className="flex items-center gap-2 pt-2 border-t">
              <label className="text-xs font-bold text-gray-600">التاريخ اليومي:</label>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-1.5 border rounded-lg text-xs font-bold" />
              <span className="text-xs text-gray-500 font-bold bg-gray-100 px-2.5 py-1 rounded-md">({formatDateToArabic(date)})</span>
            </div>
          </div>

          {/* الدرس اليومي */}
          <div className="bg-white p-4 rounded-2xl shadow-sm space-y-2 border border-gray-200">
            <h3 className="font-bold text-emerald-900 text-sm flex items-center gap-1.5">
              <span>📚</span> الدرس النظري / التجويدي لليوم
            </h3>
            <input 
              type="text" 
              readOnly={!canEdit}
              placeholder={canEdit ? "مثال: أحكام النون الساكنة والتنوين" : "لم يحدد درس اليوم بعد"} 
              value={lessonTopic} 
              onChange={e => saveLessonTopic(e.target.value)}
              className={`w-full p-2.5 border rounded-xl text-sm outline-none ${canEdit ? 'bg-gray-50 focus:bg-white focus:ring-2 ring-emerald-500' : 'bg-gray-100 text-gray-600'}`}
            />
          </div>

          {/* جدول الطلاب والحضور والتقييم */}
          <div className="bg-white p-5 rounded-2xl shadow-sm space-y-3 border border-gray-200">
            <h3 className="font-bold text-gray-800 text-sm">قائمة الطلاب ({students.length})</h3>
            
            {canEdit && (
              <div className="flex gap-2">
                <input type="text" placeholder="اسم طالب جديد" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="flex-1 p-2 border rounded-xl text-sm focus:ring-2 ring-emerald-500 outline-none" />
                <button onClick={addStudent} className="bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow hover:bg-emerald-800 transition">+ إضافة طالب</button>
              </div>
            )}

            <div className="divide-y pt-2">
              {students.map(st => {
                const evalDoc = todayEvaluations.find(e => e.studentId === st.id);
                const isAbsent = !!absentStudents[st.id];

                return (
                  <div key={st.id} className={`py-3 flex justify-between items-center ${isAbsent ? 'bg-red-50/50 px-3 rounded-xl' : ''}`}>
                    <div className="flex items-center gap-3">
                      {canEdit ? (
                        <label className="flex items-center gap-1.5 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={!isAbsent} 
                            onChange={() => toggleAttendance(st)}
                            className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer"
                          />
                          <span className={`text-xs font-bold ${isAbsent ? 'text-red-600' : 'text-emerald-700'}`}>
                            {isAbsent ? 'غائب ❌' : 'حاضر ✓'}
                          </span>
                        </label>
                      ) : (
                        <span className={`text-xs font-bold ${isAbsent ? 'text-red-600' : 'text-emerald-700'}`}>
                          {isAbsent ? 'غائب ❌' : 'حاضر ✓'}
                        </span>
                      )}

                      <div>
                        <span className={`font-bold text-sm ${isAbsent ? 'text-gray-400 line-through' : 'text-gray-800'}`}>
                          {st.name}
                        </span>
                        {evalDoc && !isAbsent && evalDoc.recitations && evalDoc.recitations.length > 0 && (
                          <span className="text-[11px] text-emerald-700 font-bold block mt-0.5">
                            ✓ تم تسجيل التقييم لليوم
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="flex gap-2 items-center">
                      {!isAbsent && canEdit && (
                        <button onClick={() => setActiveModalStudent(st)} className="bg-emerald-700 text-white text-xs px-3.5 py-1.5 rounded-xl font-bold hover:bg-emerald-800 shadow-sm transition">
                          {evalDoc && evalDoc.recitations && evalDoc.recitations.length > 0 ? 'تعديل التقييم 📝' : 'إضافة تقييم اليوم 📝'}
                        </button>
                      )}
                      {canEdit && (
                        <button onClick={() => deleteStudent(st.id)} className="text-red-400 hover:text-red-600 text-xs px-2 font-bold">حذف</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* التقرير الجاهز للواتساب */}
          <div className="bg-white p-5 rounded-2xl shadow-sm space-y-3 border border-gray-200">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                <span>💬</span> التقرير الجاهز للإرسال (واتساب)
              </h3>
              <button onClick={copyWhatsappText} className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3.5 py-1.5 rounded-xl font-bold shadow flex items-center gap-1 transition">
                <span>📋</span> نسخ النص
              </button>
            </div>

            <textarea 
              readOnly 
              rows="8" 
              value={generateWhatsappText()} 
              className="w-full p-3.5 border rounded-xl font-mono text-xs bg-gray-50 text-gray-700 leading-relaxed outline-none"
            />
          </div>

          {activeModalStudent && (
            <EvalModal 
              student={activeModalStudent} 
              circleId={selectedCircleId}
              circleName={selectedCircleObj ? selectedCircleObj.name : ''}
              date={date} 
              existingEval={todayEvaluations.find(e => e.studentId === activeModalStudent.id)}
              onClose={() => setActiveModalStudent(null)} 
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 7. نافذة إضافة تقييم
    // ==========================================
    function EvalModal({ student, circleId, circleName, date, existingEval, onClose }) {
      const [recitations, setRecitations] = React.useState(
        existingEval && existingEval.recitations && existingEval.recitations.length > 0
          ? existingEval.recitations 
          : [{ surah: JUZ_AMMA[0], rating: 'ممتاز' }]
      );
      const [behavior, setBehavior] = React.useState(existingEval ? existingEval.behavior : 'جيد');
      const [saving, setSaving] = React.useState(false);

      const addSurahRow = () => {
        setRecitations([...recitations, { surah: JUZ_AMMA[0], rating: 'ممتاز' }]);
      };

      const removeSurahRow = (index) => {
        if (recitations.length === 1) return;
        setRecitations(recitations.filter((_, i) => i !== index));
      };

      const updateRecitation = (index, field, value) => {
        const updated = [...recitations];
        updated[index][field] = value;
        setRecitations(updated);
      };

      const save = async () => {
        setSaving(true);
        try {
          if (existingEval) {
            await db.collection('evaluations').doc(existingEval.id).update({
              recitations: recitations,
              behavior: behavior,
              isAbsent: false,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            await db.collection('evaluations').add({
              studentId: student.id,
              studentName: student.name,
              circleId: circleId,
              circleName: circleName,
              date,
              isAbsent: false,
              recitations: recitations,
              behavior: behavior,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          alert(`تم حفظ تقييم الطالب (${student.name}) بنجاح!`);
          onClose();
        } catch(e) {
          alert("خطأ أثناء الحفظ: " + e.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-2xl max-w-md w-full space-y-4 max-h-[90vh] flex flex-col shadow-2xl">
            <h3 className="font-bold text-emerald-900 text-base border-b pb-2">تقييم الطالب: {student.name} ({formatDateToArabic(date)})</h3>
            
            <div className="flex-1 overflow-y-auto space-y-3 pl-1">
              <div className="flex justify-between items-center">
                <label className="text-xs font-bold text-gray-700">السور المسمّعة:</label>
                <button onClick={addSurahRow} className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold px-2 py-1 rounded-lg hover:bg-emerald-100">+ سورة أخرى</button>
              </div>

              {recitations.map((item, idx) => (
                <div key={idx} className="bg-gray-50 p-3 rounded-xl border space-y-2 relative">
                  {recitations.length > 1 && (
                    <button onClick={() => removeSurahRow(idx)} className="absolute top-1 left-2 text-red-500 font-bold text-xs">✕</button>
                  )}
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">اختر السورة:</label>
                    <select value={item.surah} onChange={e => updateRecitation(idx, 'surah', e.target.value)} className="w-full p-1.5 border rounded-lg text-xs font-bold bg-white">
                      {JUZ_AMMA.map(s => <option key={s} value={s}>سورة {s}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">تقييم الحفظ:</label>
                    <div className="flex gap-1">
                      {['إعادة', 'جيد', 'جيد جداً', 'ممتاز'].map(r => (
                        <button key={r} onClick={() => updateRecitation(idx, 'rating', r)} className={`flex-1 p-1 text-[11px] border rounded-lg font-bold transition ${item.rating === r ? 'bg-emerald-700 text-white' : 'bg-white text-gray-700'}`}>{r}</button>
                      ))}
                    </div>
                  </div>
                </div>
              ))}

              <div className="pt-2">
                <label className="block text-xs font-bold text-gray-700 mb-1">تقييم السلوك لليوم:</label>
                <div className="flex gap-2">
                  {['جيد', 'بحاجة تحسين'].map(b => (
                    <button key={b} onClick={() => setBehavior(b)} className={`flex-1 p-2 text-xs border rounded-xl font-bold transition ${behavior === b ? 'bg-emerald-700 text-white' : 'bg-gray-50 text-gray-700'}`}>{b}</button>
                  ))}
                </div>
              </div>
            </div>

            <div className="pt-2 space-y-2 border-t">
              <button disabled={saving} onClick={save} className="w-full bg-emerald-700 text-white py-2.5 rounded-xl font-bold shadow hover:bg-emerald-800 transition disabled:opacity-50">
                {saving ? 'جاري الحفظ...' : 'حفظ التقييم الإجمالي'}
              </button>
              <button onClick={onClose} className="w-full bg-gray-100 text-gray-600 py-2 rounded-xl text-sm font-bold">إغلاق</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. لائحة البيانات العامة التراكمية
    // ==========================================
    function GlobalDatabaseView({ userProfile }) {
      const [circles, setCircles] = React.useState([]);
      const [students, setStudents] = React.useState([]);
      const [evaluations, setEvaluations] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const fetchData = async () => {
          const cSnap = await db.collection('circles').get();
          const sSnap = await db.collection('students').get();
          const eSnap = await db.collection('evaluations').get();

          setCircles(cSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setStudents(sSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setEvaluations(eSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        };
        fetchData();
      }, []);

      const calculateGeneralBehavior = (studentEvals) => {
        const validEvals = studentEvals.filter(e => !e.isAbsent);
        if (validEvals.length === 0) return 'لا يوجد تقييمات';
        let goodCount = 0;
        let needsImpCount = 0;

        validEvals.forEach(e => {
          if (e.behavior === 'جيد') goodCount++;
          if (e.behavior === 'بحاجة تحسين') needsImpCount++;
        });

        return goodCount >= needsImpCount ? 'السلوك العام: جيد' : 'السلوك العام: بحاجة تحسين';
      };

      if (loading) return <div className="text-center py-12 font-bold text-emerald-800">جاري تحميل السجل التراكمي العام...</div>;

      return (
        <div className="space-y-6">
          <div className="bg-emerald-900 text-white p-6 rounded-2xl shadow-md text-center space-y-1">
            <h2 className="text-xl font-black">📊 السجل التراكمي الشامل لجميع المساجد والحلقات</h2>
            <p className="text-xs text-emerald-200">عرض تاريخ التسميع التراكمي والسلوك الإجمالي لكافة الطلاب</p>
          </div>

          {circles.map(circle => {
            const circleStudents = students.filter(s => s.circleId === circle.id);
            return (
              <div key={circle.id} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div className="bg-emerald-800 text-white px-5 py-3 font-bold text-sm flex justify-between items-center">
                  <span className="flex items-center gap-2"><span>🕌</span> حلقة: {circle.name}</span>
                  <span className="text-xs font-bold bg-emerald-900/60 px-2.5 py-1 rounded-lg border border-emerald-700">{circle.masjidId || 'مسجد عام'}</span>
                </div>

                <div className="p-5 space-y-4 divide-y">
                  {circleStudents.length === 0 ? (
                    <p className="text-xs text-gray-400">لا يوجد طلاب مسجلون في هذه الحلقة.</p>
                  ) : (
                    circleStudents.map(student => {
                      const studentEvals = evaluations.filter(e => e.studentId === student.id && !e.isAbsent);
                      const generalBehavior = calculateGeneralBehavior(studentEvals);

                      return (
                        <div key={student.id} className="pt-3 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-sm md:text-base text-gray-800">👤 {student.name}</span>
                            <span className={`text-xs px-3 py-1 rounded-full font-bold ${generalBehavior.includes('جيد') ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-amber-100 text-amber-800 border border-amber-300'}`}>
                              {generalBehavior}
                            </span>
                          </div>

                          <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 text-xs space-y-1.5">
                            <span className="font-bold text-gray-600 block mb-1">📖 السور المسمّعة والتاريخ:</span>
                            {studentEvals.length === 0 ? (
                              <span className="text-gray-400">لم يقم بالتسميع بعد.</span>
                            ) : (
                              studentEvals.map((ev, i) => (
                                <div key={i} className="flex flex-wrap items-center gap-2 border-b border-gray-200/60 pb-1.5 last:border-0">
                                  <span className="text-gray-400 font-mono text-[11px]">[{formatDateToArabic(ev.date)}]</span>
                                  {ev.recitations && ev.recitations.length > 0 ? (
                                    ev.recitations.map((r, rIdx) => (
                                      <span key={rIdx} className="bg-white px-2.5 py-1 border border-gray-200 rounded-lg font-bold text-emerald-800 shadow-sm">
                                        سورة {r.surah} ({r.rating})
                                      </span>
                                    ))
                                  ) : ev.surah ? (
                                    <span className="bg-white px-2.5 py-1 border border-gray-200 rounded-lg font-bold text-emerald-800 shadow-sm">
                                      سورة {ev.surah} ({ev.rating})
                                    </span>
                                  ) : null}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
