<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة حلقات القرآن الكريم - جامع حمود الناصر</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. إعدادات Firebase
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyBCzlYbSq6ocwpDzhEeEZr0eDrg6cM3ecc",
  authDomain: "hamod-naser.firebaseapp.com",
  projectId: "hamod-naser",
  storageBucket: "hamod-naser.firebasestorage.app",
  messagingSenderId: "337847802811",
  appId: "1:337847802811:web:7e6c5989a4137310bc029e",
  measurementId: "G-YTXZNQ59QR"
};
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const JUZ_AMMA = [
      'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين', 'الانشقاق', 'البروج', 
      'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'الليل', 'الضحى', 
      'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 
      'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 
      'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'
    ];

    function App() {
      const [user, setUser] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) return <div className="flex justify-center items-center h-screen text-emerald-800 font-bold">جاري التحميل...</div>;

      return user ? <MainLayout user={user} /> : <AuthScreen />;
    }

    // ==========================================
    // 2. شاشة تسجيل الدخول
    // ==========================================
    function AuthScreen() {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [isSignUp, setIsSignUp] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          alert("خطأ: " + err.message);
        }
      };

      return (
        <div className="flex items-center justify-center min-h-screen p-4">
          <div className="bg-white p-8 rounded-2xl shadow-md max-w-sm w-full space-y-4">
            <h2 className="text-xl font-bold text-center text-emerald-800">🕌 جامع حمود الناصر</h2>
            <p className="text-xs text-center text-gray-500 font-bold">نظام إدارة حلقات القرآن الكريم</p>
            <form onSubmit={handleSubmit} className="space-y-3 pt-2">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">كلمة المرور</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
              </div>
              <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700">
                {isSignUp ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
              </button>
            </form>
            <button onClick={() => setIsSignUp(!isSignUp)} className="w-full text-xs text-emerald-700 underline text-center block">
              {isSignUp ? 'لديك حساب؟ سجل دخولك' : 'حساب جديد؟ اضغط هنا'}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. الهيكل الرئيسي مع الشريط العلوي
    // ==========================================
    function MainLayout({ user }) {
      const [currentView, setCurrentView] = React.useState('dashboard'); // 'dashboard' | 'global_db'

      return (
        <div className="min-h-screen flex flex-col">
          {/* الشريط العلوي */}
          <header className="bg-emerald-800 text-white px-6 py-3 shadow-md flex justify-between items-center sticky top-0 z-40">
            <div className="font-bold text-sm md:text-base flex items-center gap-2">
              <span>🕌</span>
              <span>جامع حمود الناصر</span>
            </div>
            
            <h1 className="text-base md:text-lg font-bold text-emerald-100 hidden sm:block">
              نظام إدارة حلقات القرآن
            </h1>

            <div className="flex items-center gap-3">
              {currentView === 'dashboard' ? (
                <button 
                  onClick={() => setCurrentView('global_db')} 
                  className="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold shadow transition flex items-center gap-1 border border-emerald-500"
                >
                  <span>📊</span> قاعدة البيانات التراكمية
                </button>
              ) : (
                <button 
                  onClick={() => setCurrentView('dashboard')} 
                  className="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold shadow transition flex items-center gap-1 border border-emerald-500"
                >
                  <span>🏠</span> إدارة الحلقات
                </button>
              )}
              <button 
                onClick={() => auth.signOut()} 
                className="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow"
              >
                خروج
              </button>
            </div>
          </header>

          {/* محتوى الصفحة */}
          <main className="flex-1 max-w-4xl w-full mx-auto p-4">
            {currentView === 'dashboard' ? <Dashboard user={user} /> : <GlobalDatabaseView />}
          </main>
        </div>
      );
    }

    // ==========================================
    // 4. لوحة التحكم الرئيسية (إدارة الحلقات والطلاب والدروس)
    // ==========================================
    function Dashboard({ user }) {
      const [circles, setCircles] = React.useState([]);
      const [selectedCircleId, setSelectedCircleId] = React.useState('');
      const [newCircleName, setNewCircleName] = React.useState('');
      const [students, setStudents] = React.useState([]);
      const [newStudentName, setNewStudentName] = React.useState('');
      const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
      
      // الدرس النظري
      const [lessonTopic, setLessonTopic] = React.useState('');
      
      // التقييمات المحفوظة لليوم
      const [todayEvaluations, setTodayEvaluations] = React.useState([]);
      const [activeModalStudent, setActiveModalStudent] = React.useState(null);

      // جلب الحلقات
      React.useEffect(() => {
        const unsub = db.collection('circles')
          .where('userId', '==', user.uid)
          .onSnapshot(snap => {
            const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setCircles(list);
            if (list.length > 0 && !selectedCircleId) setSelectedCircleId(list[0].id);
          });
        return () => unsub();
      }, [user]);

      // جلب الطلاب والدرس والتقييمات الخاصة بالحلقة والتاريخ المحددين
      React.useEffect(() => {
        if (!selectedCircleId) { 
          setStudents([]); 
          setTodayEvaluations([]); 
          setLessonTopic('');
          return; 
        }

        // 1. الطلاب
        const unsubStudents = db.collection('students')
          .where('circleId', '==', selectedCircleId)
          .onSnapshot(snap => {
            setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

        // 2. التقييمات اليومية
        const unsubEvals = db.collection('evaluations')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .onSnapshot(snap => {
            setTodayEvaluations(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

        // 3. الدرس النظري لليوم
        const unsubLesson = db.collection('lessons')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .onSnapshot(snap => {
            if (!snap.empty) {
              setLessonTopic(snap.docs[0].data().topic || '');
            } else {
              setLessonTopic('');
            }
          });

        return () => {
          unsubStudents();
          unsubEvals();
          unsubLesson();
        };
      }, [selectedCircleId, date]);

      const addCircle = async () => {
        if (!newCircleName.trim()) return;
        await db.collection('circles').add({ name: newCircleName.trim(), userId: user.uid });
        setNewCircleName('');
      };

      const editCircleName = async (circle) => {
        const updated = prompt("أدخل الاسم الجديد للحلقة:", circle.name);
        if (updated && updated.trim()) {
          await db.collection('circles').doc(circle.id).update({ name: updated.trim() });
        }
      };

      const deleteCircle = async (circle) => {
        if (!confirm(`هل أنت تأكد من أنك تريد حذف حلقة (${circle.name})؟`)) return;
        
        const password = prompt("تنبيه أمني! أدخل كلمة المرور لتأكيد حذف الحلقة:");
        if (password === "yesdelete") {
          await db.collection('circles').doc(circle.id).delete();
          setSelectedCircleId('');
          alert("تم حذف الحلقة بنجاح.");
        } else if (password !== null) {
          alert("كلمة المرور خاطئة! تم إلغاء الحذف.");
        }
      };

      const addStudent = async () => {
        if (!newStudentName.trim() || !selectedCircleId) return;
        await db.collection('students').add({ name: newStudentName.trim(), circleId: selectedCircleId });
        setNewStudentName('');
      };

      const deleteStudent = async (id) => {
        if (confirm("هل أنت تأكد من حذف هذا الطالب؟")) {
          await db.collection('students').doc(id).delete();
        }
      };

      const saveLessonTopic = async (topicValue) => {
        setLessonTopic(topicValue);
        if (!selectedCircleId) return;
        
        const snap = await db.collection('lessons')
          .where('circleId', '==', selectedCircleId)
          .where('date', '==', date)
          .get();

        if (snap.empty) {
          await db.collection('lessons').add({
            circleId: selectedCircleId,
            date: date,
            topic: topicValue
          });
        } else {
          await db.collection('lessons').doc(snap.docs[0].id).update({ topic: topicValue });
        }
      };

      const selectedCircleObj = circles.find(c => c.id === selectedCircleId);

      // توليد نص الواتساب الجاهز للنسخ
      const generateWhatsappText = () => {
        if (!selectedCircleObj) return '';

        let text = `*تقرير حلقة: ${selectedCircleObj.name}*\n`;
        text += `*التاريخ:* ${date}\n`;
        if (lessonTopic.trim()) {
          text += `*الدرس النظري/التجويدي:* ${lessonTopic.trim()}\n`;
        }
        text += `-----------------------------------\n\n`;

        if (students.length === 0) {
          text += `لا يوجد طلاب مسجلون في هذه الحلقة.`;
          return text;
        }

        students.forEach((st, idx) => {
          const evalDoc = todayEvaluations.find(e => e.studentId === st.id);
          text += `${idx + 1}. *${st.name}*:\n`;
          if (evalDoc) {
            if (evalDoc.recitations && evalDoc.recitations.length > 0) {
              evalDoc.recitations.forEach(r => {
                text += `  - سورة ${r.surah}: ${r.rating}\n`;
              });
            } else if (evalDoc.surah) {
              text += `  - سورة ${evalDoc.surah}: ${evalDoc.rating}\n`;
            }
            text += `  - السلوك: ${evalDoc.behavior}\n`;
          } else {
            text += `  - (غائب / لم يسمّع اليوم)\n`;
          }
          text += `\n`;
        });

        text += `دعواتنا لكم بالتوفيق والنجاح 🌟`;
        return text;
      };

      const copyWhatsappText = () => {
        const text = generateWhatsappText();
        navigator.clipboard.writeText(text);
        alert("تم نسخ التقرير النصي بنجاح! يمكنك الآن لصقه في الواتساب.");
      };

      return (
        <div className="space-y-4">
          {/* قسم اختيار وإدارة الحلقات والتاريخ */}
          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
            <div className="flex flex-wrap gap-2 items-center">
              <label className="text-xs font-bold text-gray-600">اختر الحلقة:</label>
              <select value={selectedCircleId} onChange={e => setSelectedCircleId(e.target.value)} className="flex-1 min-w-[180px] p-2 border rounded-lg text-sm font-bold">
                {circles.length === 0 ? <option>لا يوجد حلقات - قم بإنشاء واحدة</option> : circles.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>

              {/* أزرار تعديل وحذف الحلقة المحددة */}
              {selectedCircleObj && (
                <div className="flex gap-1">
                  <button onClick={() => editCircleName(selectedCircleObj)} title="تعديل اسم الحلقة" className="bg-amber-50 text-amber-700 border border-amber-300 p-2 rounded-lg text-xs font-bold hover:bg-amber-100">✏️</button>
                  <button onClick={() => deleteCircle(selectedCircleObj)} title="حذف الحلقة" className="bg-red-50 text-red-700 border border-red-300 p-2 rounded-lg text-xs font-bold hover:bg-red-100">🗑️</button>
                </div>
              )}
            </div>

            {/* إضافة حلقة جديدة */}
            <div className="flex gap-2 pt-2 border-t">
              <input type="text" placeholder="اسم حلقة جديدة" value={newCircleName} onChange={e => setNewCircleName(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm" />
              <button onClick={addCircle} className="bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-800">+ إضافة حلقة</button>
            </div>

            <div className="flex items-center gap-2 pt-2 border-t">
              <label className="text-xs font-bold text-gray-600">تاريخ التقييم اليومي:</label>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-1.5 border rounded-lg text-xs font-bold" />
            </div>
          </div>

          {/* قسم الدروس النظرية */}
          <div className="bg-white p-4 rounded-xl shadow-sm space-y-2 border">
            <h3 className="font-bold text-emerald-800 text-sm flex items-center gap-1">
              📚 الدرس النظري / التجويدي لليوم
            </h3>
            <input 
              type="text" 
              placeholder="مثال: أحكام النون الساكنة والتنوين - الإظهار" 
              value={lessonTopic} 
              onChange={e => saveLessonTopic(e.target.value)}
              className="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white" 
            />
            <p className="text-[11px] text-gray-400">يتم حفظ الدرس تلقائياً وسيتم تضمينه في التقرير اليومي.</p>
          </div>

          {/* قائمة الطلاب */}
          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
            <h3 className="font-bold text-gray-700 text-sm">قائمة الطلاب ({students.length})</h3>
            
            <div className="flex gap-2">
              <input type="text" placeholder="اسم طالب جديد" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm" />
              <button onClick={addStudent} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-800">+ إضافة طالب</button>
            </div>

            <div className="divide-y pt-2">
              {students.map(st => {
                const evalDoc = todayEvaluations.find(e => e.studentId === st.id);
                return (
                  <div key={st.id} className="py-2.5 flex justify-between items-center">
                    <div>
                      <span className="font-bold text-sm text-gray-800 block">{st.name}</span>
                      {evalDoc && (
                        <span className="text-[11px] text-emerald-600 font-semibold block mt-0.5">
                          ✓ تم التقييم لليوم
                        </span>
                      )}
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setActiveModalStudent(st)} className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-700 shadow">
                        {evalDoc ? 'تعديل التقييم 📝' : 'إضافة تقييم اليوم 📝'}
                      </button>
                      <button onClick={() => deleteStudent(st.id)} className="text-red-400 hover:text-red-600 text-xs px-1">حذف</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* قسم التقرير الجاهز للنسخ إلى الواتساب */}
          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-gray-700 text-sm flex items-center gap-1">
                💬 التقرير الجاهز للإرسال (واتساب)
              </h3>
              <button onClick={copyWhatsappText} className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow flex items-center gap-1">
                📋 نسخ النص
              </button>
            </div>

            <textarea 
              readOnly 
              rows="7" 
              value={generateWhatsappText()} 
              className="w-full p-3 border rounded-lg font-mono text-xs bg-gray-50 text-gray-700 leading-relaxed"
            />
          </div>

          {/* نافذة التقييم اليومي المتعدد السور */}
          {activeModalStudent && (
            <EvalModal 
              student={activeModalStudent} 
              circleId={selectedCircleId}
              circleName={selectedCircleObj ? selectedCircleObj.name : ''}
              date={date} 
              existingEval={todayEvaluations.find(e => e.studentId === activeModalStudent.id)}
              onClose={() => setActiveModalStudent(null)} 
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 5. نافذة إضافة تقييم (تعدد السور للسُمّاع الواحدة)
    // ==========================================
    function EvalModal({ student, circleId, circleName, date, existingEval, onClose }) {
      const [recitations, setRecitations] = React.useState(
        existingEval && existingEval.recitations 
          ? existingEval.recitations 
          : [{ surah: JUZ_AMMA[0], rating: 'ممتاز' }]
      );
      const [behavior, setBehavior] = React.useState(existingEval ? existingEval.behavior : 'جيد');
      const [saving, setSaving] = React.useState(false);

      const addSurahRow = () => {
        setRecitations([...recitations, { surah: JUZ_AMMA[0], rating: 'ممتاز' }]);
      };

      const removeSurahRow = (index) => {
        if (recitations.length === 1) return;
        setRecitations(recitations.filter((_, i) => i !== index));
      };

      const updateRecitation = (index, field, value) => {
        const updated = [...recitations];
        updated[index][field] = value;
        setRecitations(updated);
      };

      const save = async () => {
        setSaving(true);
        try {
          if (existingEval) {
            await db.collection('evaluations').doc(existingEval.id).update({
              recitations: recitations,
              behavior: behavior,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            await db.collection('evaluations').add({
              studentId: student.id,
              studentName: student.name,
              circleId: circleId,
              circleName: circleName,
              date,
              recitations: recitations,
              behavior: behavior,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          alert(`تم حفظ تقييم الطالب (${student.name}) بنجاح!`);
          onClose();
        } catch(e) {
          alert("خطأ أثناء الحفظ: " + e.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-xl max-w-md w-full space-y-4 max-h-[90vh] flex flex-col">
            <h3 className="font-bold text-emerald-800 text-base border-b pb-2">تقييم اليوم: {student.name} ({date})</h3>
            
            <div className="flex-1 overflow-y-auto space-y-3 pl-1">
              <div className="flex justify-between items-center">
                <label className="text-xs font-bold text-gray-700">السور المسمّعة:</label>
                <button onClick={addSurahRow} className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold px-2 py-1 rounded-lg hover:bg-emerald-100">+ سورة أخرى</button>
              </div>

              {recitations.map((item, idx) => (
                <div key={idx} className="bg-gray-50 p-3 rounded-lg border space-y-2 relative">
                  {recitations.length > 1 && (
                    <button onClick={() => removeSurahRow(idx)} className="absolute top-1 left-2 text-red-500 font-bold text-xs">✕</button>
                  )}
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">اختر السورة:</label>
                    <select value={item.surah} onChange={e => updateRecitation(idx, 'surah', e.target.value)} className="w-full p-1.5 border rounded text-xs font-bold">
                      {JUZ_AMMA.map(s => <option key={s} value={s}>سورة {s}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">تقييم الحفظ:</label>
                    <div className="flex gap-1">
                      {['إعادة', 'جيد', 'جيد جداً', 'ممتاز'].map(r => (
                        <button key={r} onClick={() => updateRecitation(idx, 'rating', r)} className={`flex-1 p-1 text-[11px] border rounded font-bold ${item.rating === r ? 'bg-emerald-600 text-white' : 'bg-white text-gray-700'}`}>{r}</button>
                      ))}
                    </div>
                  </div>
                </div>
              ))}

              <div className="pt-2">
                <label className="block text-xs font-bold text-gray-700 mb-1">تقييم السلوك لليوم:</label>
                <div className="flex gap-2">
                  {['جيد', 'بحاجة تحسين'].map(b => (
                    <button key={b} onClick={() => setBehavior(b)} className={`flex-1 p-2 text-xs border rounded-lg font-bold ${behavior === b ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-700'}`}>{b}</button>
                  ))}
                </div>
              </div>
            </div>

            <div className="pt-2 space-y-2 border-t">
              <button disabled={saving} onClick={save} className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700 disabled:opacity-50">
                {saving ? 'جاري الحفظ...' : 'حفظ التقييم الإجمالي'}
              </button>
              <button onClick={onClose} className="w-full bg-gray-100 text-gray-600 py-1.5 rounded-lg text-sm font-bold">إغلاق</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. لائحة البيانات العامة (قراءة فقط - التراكمية)
    // ==========================================
    function GlobalDatabaseView() {
      const [circles, setCircles] = React.useState([]);
      const [students, setStudents] = React.useState([]);
      const [evaluations, setEvaluations] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const fetchData = async () => {
          const cSnap = await db.collection('circles').get();
          const sSnap = await db.collection('students').get();
          const eSnap = await db.collection('evaluations').get();

          setCircles(cSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setStudents(sSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setEvaluations(eSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        };
        fetchData();
      }, []);

      // دالة حساب السلوك العام للطالب (الغالبية)
      const calculateGeneralBehavior = (studentEvals) => {
        if (studentEvals.length === 0) return 'لا يوجد تقييمات';
        let goodCount = 0;
        let needsImpCount = 0;

        studentEvals.forEach(e => {
          if (e.behavior === 'جيد') goodCount++;
          if (e.behavior === 'بحاجة تحسين') needsImpCount++;
        });

        return goodCount >= needsImpCount ? 'السلوك العام: جيد' : 'السلوك العام: بحاجة تحسين';
      };

      if (loading) return <div className="text-center py-10 font-bold text-emerald-800">جاري تحميل لائحة البيانات العامة...</div>;

      return (
        <div className="space-y-6">
          <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
            <h2 className="text-lg font-bold text-emerald-900">📊 السجل التراكمي العام للمجمع</h2>
            <p className="text-xs text-emerald-700 mt-1">عرض شامل لقراءة السور المسمّعة والسلوك العام لجميع الطلاب موزعين حسب الحلقات</p>
          </div>

          {circles.map(circle => {
            const circleStudents = students.filter(s => s.circleId === circle.id);
            return (
              <div key={circle.id} className="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div className="bg-emerald-800 text-white px-4 py-2 font-bold text-sm">
                  🕌 حلقة: {circle.name}
                </div>

                <div className="p-4 space-y-4 divide-y">
                  {circleStudents.length === 0 ? (
                    <p className="text-xs text-gray-400">لا يوجد طلاب مسجلون في هذه الحلقة.</p>
                  ) : (
                    circleStudents.map(student => {
                      const studentEvals = evaluations.filter(e => e.studentId === student.id);
                      const generalBehavior = calculateGeneralBehavior(studentEvals);

                      return (
                        <div key={student.id} className="pt-3 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-base text-gray-800">👤 {student.name}</span>
                            <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${generalBehavior.includes('جيد') ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                              {generalBehavior}
                            </span>
                          </div>

                          {/* قائمة السور المسمعة للتطبيق */}
                          <div className="bg-gray-50 p-3 rounded-lg border text-xs space-y-1.5">
                            <span className="font-bold text-gray-600 block mb-1">📖 السور المسمّعة والتاريخ:</span>
                            {studentEvals.length === 0 ? (
                              <span className="text-gray-400">لم يقم بالتسميع بعد.</span>
                            ) : (
                              studentEvals.map((ev, i) => (
                                <div key={i} className="flex flex-wrap items-center gap-2 border-b border-gray-200 pb-1 last:border-0">
                                  <span className="text-gray-400 font-mono">[{ev.date}]</span>
                                  {ev.recitations ? (
                                    ev.recitations.map((r, rIdx) => (
                                      <span key={rIdx} className="bg-white px-2 py-0.5 border rounded font-semibold text-emerald-800">
                                        سورة {r.surah} ({r.rating})
                                      </span>
                                    ))
                                  ) : (
                                    <span className="bg-white px-2 py-0.5 border rounded font-semibold text-emerald-800">
                                      سورة {ev.surah} ({ev.rating})
                                    </span>
                                  )}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
