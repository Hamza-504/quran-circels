<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة حلقات القرآن الكريم</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. إعدادات Firebase
    // ==========================================
   const firebaseConfig = {
  apiKey: "AIzaSyBCzlYbSq6ocwpDzhEeEZr0eDrg6cM3ecc",
  authDomain: "hamod-naser.firebaseapp.com",
  projectId: "hamod-naser",
  storageBucket: "hamod-naser.firebasestorage.app",
  messagingSenderId: "337847802811",
  appId: "1:337847802811:web:7e6c5989a4137310bc029e",
  measurementId: "G-YTXZNQ59QR"
};

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const JUZ_AMMA = [
      'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين', 'الانشقاق', 'البروج', 
      'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'الليل', 'الضحى', 
      'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 
      'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 
      'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'
    ];

    function App() {
      const [user, setUser] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) return <div className="flex justify-center items-center h-screen text-emerald-800 font-bold">جاري التحميل...</div>;

      return user ? <Dashboard user={user} /> : <AuthScreen />;
    }

    // ==========================================
    // 2. شاشة تسجيل الدخول
    // ==========================================
    function AuthScreen() {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [isSignUp, setIsSignUp] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          alert("خطأ: " + err.message);
        }
      };

      return (
        <div className="flex items-center justify-center min-h-screen p-4">
          <div className="bg-white p-8 rounded-2xl shadow-md max-w-sm w-full space-y-4">
            <h2 className="text-xl font-bold text-center text-emerald-800">🕌 نظام إدارة حلقات القرآن</h2>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">كلمة المرور</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
              </div>
              <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700">
                {isSignUp ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
              </button>
            </form>
            <button onClick={() => setIsSignUp(!isSignUp)} className="w-full text-xs text-emerald-700 underline text-center block">
              {isSignUp ? 'لديك حساب؟ سجل دخولك' : 'حساب جديد؟ اضغط هنا'}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. لوحة التحكم الرئيسية (حفظ تزامني وتراكمي)
    // ==========================================
    function Dashboard({ user }) {
      const [circles, setCircles] = React.useState([]);
      const [selectedCircleId, setSelectedCircleId] = React.useState('');
      const [newCircleName, setNewCircleName] = React.useState('');
      const [students, setStudents] = React.useState([]);
      const [newStudentName, setNewStudentName] = React.useState('');
      const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [activeModalStudent, setActiveModalStudent] = React.useState(null);
      const [historyStudent, setHistoryStudent] = React.useState(null);

      // جلب الحلقات الخاصة بالمشرف في الوقت الفعلي
      React.useEffect(() => {
        const unsub = db.collection('circles')
          .where('userId', '==', user.uid)
          .onSnapshot(snap => {
            const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setCircles(list);
            if (list.length > 0 && !selectedCircleId) setSelectedCircleId(list[0].id);
          });
        return () => unsub();
      }, [user]);

      // جلب طلاب الحلقة المحددة
      React.useEffect(() => {
        if (!selectedCircleId) { setStudents([]); return; }
        const unsub = db.collection('students')
          .where('circleId', '==', selectedCircleId)
          .onSnapshot(snap => {
            setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
        return () => unsub();
      }, [selectedCircleId]);

      const addCircle = async () => {
        if (!newCircleName.trim()) return;
        await db.collection('circles').add({ name: newCircleName.trim(), userId: user.uid });
        setNewCircleName('');
      };

      const addStudent = async () => {
        if (!newStudentName.trim() || !selectedCircleId) return;
        await db.collection('students').add({ name: newStudentName.trim(), circleId: selectedCircleId });
        setNewStudentName('');
      };

      const deleteStudent = async (id) => {
        if (confirm("هل أنت تأكد من حذف هذا الطالب؟")) {
          await db.collection('students').doc(id).delete();
        }
      };

      return (
        <div className="max-w-3xl mx-auto p-4 space-y-4">
          <header className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <h1 className="text-lg font-bold text-emerald-800">نظام إدارة الحلقات</h1>
            <button onClick={() => auth.signOut()} className="text-xs text-red-600 bg-red-50 border border-red-200 px-3 py-1 rounded-lg">خروج</button>
          </header>

          {/* اختيار وإضافة الحلقات */}
          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <div className="flex gap-2">
              <select value={selectedCircleId} onChange={e => setSelectedCircleId(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm font-bold">
                {circles.length === 0 ? <option>لا يوجد حلقات - قم بإنشاء واحدة</option> : circles.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <input type="text" placeholder="اسم حلقة جديدة" value={newCircleName} onChange={e => setNewCircleName(e.target.value)} className="p-2 border rounded-lg text-sm w-1/3" />
              <button onClick={addCircle} className="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-bold shadow">+ إضافة</button>
            </div>

            <div className="flex items-center gap-2 pt-2 border-t">
              <label className="text-xs font-bold text-gray-600">تاريخ اليوم:</label>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-1 border rounded text-xs font-bold" />
            </div>
          </div>

          {/* قائمة الطلاب والتقييم */}
          <div className="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h3 className="font-bold text-gray-700 text-sm">قائمة الطلاب ({students.length})</h3>
            
            <div className="flex gap-2">
              <input type="text" placeholder="اسم طالب جديد" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm" />
              <button onClick={addStudent} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow">+ إضافة طالب</button>
            </div>

            <div className="divide-y pt-2">
              {students.map(st => (
                <div key={st.id} className="py-2 flex justify-between items-center">
                  <span className="font-bold text-sm text-gray-800">{st.name}</span>
                  <div className="flex gap-2">
                    <button onClick={() => setActiveModalStudent(st)} className="bg-emerald-50 text-emerald-700 border border-emerald-300 text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-600 hover:text-white transition">تقييم اليوم</button>
                    <button onClick={() => setHistoryStudent(st)} className="bg-blue-50 text-blue-700 border border-blue-300 text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-blue-600 hover:text-white transition">سجل الطالب 📜</button>
                    <button onClick={() => deleteStudent(st.id)} className="text-red-500 hover:text-red-700 text-xs px-1">حذف</button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* النافذة المباشرة لتقييم الطالب */}
          {activeModalStudent && <EvalModal student={activeModalStudent} date={date} onClose={() => setActiveModalStudent(null)} />}
          
          {/* النافذة الخاصة بتاريخ وسجل الطالب التراكمي */}
          {historyStudent && <HistoryModal student={historyStudent} onClose={() => setHistoryStudent(null)} />}
        </div>
      );
    }

    // ==========================================
    // 4. نافذة التقييم الحفظ والسلوك
    // ==========================================
    function EvalModal({ student, date, onClose }) {
      const [surah, setSurah] = React.useState(JUZ_AMMA[0]);
      const [rating, setRating] = React.useState('ممتاز');
      const [behavior, setBehavior] = React.useState('جيد');
      const [saving, setSaving] = React.useState(false);

      const save = async () => {
        setSaving(true);
        try {
          // حفظ التقييم بـ ID فريد يجمع التاريخ والطالب والسورة لتراكم البيانات دون ضياع
          await db.collection('evaluations').add({
            studentId: student.id,
            studentName: student.name,
            date,
            surah,
            rating,
            behavior,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert(`تم حفظ تقييم ${student.name} لـ سورة ${surah} بنجاح!`);
          onClose();
        } catch(e) {
          alert("خطأ أثناء الحفظ: " + e.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-xl max-w-md w-full space-y-3">
            <h3 className="font-bold text-emerald-800 text-base">تقييم الطالب: {student.name}</h3>
            
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">السورة:</label>
              <select value={surah} onChange={e => setSurah(e.target.value)} className="w-full p-2 border rounded text-sm">
                {JUZ_AMMA.map(s => <option key={s} value={s}>سورة {s}</option>)}
              </select>
            </div>

            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">تقييم الحفظ:</label>
              <div className="flex gap-1">
                {['إعادة', 'جيد', 'جيد جداً', 'ممتاز'].map(r => (
                  <button key={r} onClick={() => setRating(r)} className={`flex-1 p-2 text-xs border rounded font-bold ${rating === r ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-700'}`}>{r}</button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">تقييم السلوك:</label>
              <div className="flex gap-1">
                {['جيد', 'بحاجة تحسين'].map(b => (
                  <button key={b} onClick={() => setBehavior(b)} className={`flex-1 p-2 text-xs border rounded font-bold ${behavior === b ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-700'}`}>{b}</button>
                ))}
              </div>
            </div>

            <div className="pt-2 space-y-2">
              <button disabled={saving} onClick={save} className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold shadow hover:bg-emerald-700 disabled:opacity-50">
                {saving ? 'جاري الحفظ...' : 'حفظ التقييم'}
              </button>
              <button onClick={onClose} className="w-full bg-gray-100 text-gray-600 py-1.5 rounded-lg text-sm font-bold">إغلاق</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. نافذة استعراض سجل الطالب التراكمي التاريخي
    // ==========================================
    function HistoryModal({ student, onClose }) {
      const [logs, setLogs] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        db.collection('evaluations')
          .where('studentId', '==', student.id)
          .get()
          .then(snap => {
            const list = snap.docs.map(doc => doc.data());
            // ترتيب السجلات حسب التاريخ من الأحدث للأقدم
            list.sort((a, b) => new Date(b.date) - new Date(a.date));
            setLogs(list);
            setLoading(false);
          });
      }, [student]);

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white p-6 rounded-xl max-w-lg w-full space-y-4 max-h-[80vh] flex flex-col">
            <h3 className="font-bold text-emerald-800 text-base border-b pb-2">📜 سجل وتقييمات الطالب: {student.name}</h3>
            
            <div className="flex-1 overflow-y-auto space-y-2">
              {loading ? (
                <p className="text-center text-xs text-gray-500 py-4">جاري تحميل السجل...</p>
              ) : logs.length === 0 ? (
                <p className="text-center text-xs text-gray-500 py-4">لا يوجد تقييمات سابقة لهذا الطالب.</p>
              ) : (
                logs.map((item, idx) => (
                  <div key={idx} className="bg-gray-50 p-3 rounded-lg border flex justify-between items-center text-xs">
                    <div>
                      <span className="font-bold block text-gray-700">سورة {item.surah}</span>
                      <span className="text-gray-400">{item.date}</span>
                    </div>
                    <div className="flex gap-2">
                      <span className="bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-bold">الحفظ: {item.rating}</span>
                      <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold">السلوك: {item.behavior}</span>
                    </div>
                  </div>
                ))
              )}
            </div>

            <button onClick={onClose} className="w-full bg-gray-200 text-gray-800 py-2 rounded-lg font-bold text-sm">إغلاق</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
